<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Osservazioni pedagogiche — V1 multi-tenant</title>
<style>
  :root {
    --carta: #f6f4ee; --carta-scura: #ece8dc; --inchiostro: #232620; --inchiostro-tenue: #5b5d54;
    --riga: #d8d3c3; --accento: #2f4d3a; --ombra: 0 1px 2px rgba(35,38,32,.08);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--carta); color: var(--inchiostro); font: 15px/1.45 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  header.app { display: flex; align-items: center; gap: 1rem; padding: .85rem 1.25rem; background: var(--accento); color: #f3f1e8; position: sticky; top: 0; z-index: 20; flex-wrap: wrap; }
  header.app h1 { font-size: 1.05rem; font-weight: 600; margin: 0; letter-spacing: .01em; }
  header.app .filo { flex: 1; opacity: .9; font-size: .85rem; }
  header.app select, header.app button { font: inherit; padding: .3rem .5rem; border-radius: 5px; border: 1px solid transparent; }
  header.app button.link { background: none; border: none; color: #f3f1e8; text-decoration: underline; cursor: pointer; }
  nav.principale { display: flex; gap: .3rem; flex-wrap: wrap; padding: .5rem 1.25rem; background: var(--carta-scura); position: sticky; top: 52px; z-index: 19; border-bottom: 1px solid var(--riga); }
  nav.principale button { font: inherit; font-size: .85rem; padding: .4rem .8rem; border-radius: 6px; border: 1px solid transparent; background: none; color: var(--inchiostro); cursor: pointer; }
  nav.principale button:hover { background: #fff; }
  nav.principale button.attiva { background: var(--accento); color: #fff; }
  main { max-width: 1040px; margin: 0 auto; padding: 1.25rem; }
  .avviso { background: #fbf0d9; border: 1px solid #e3c583; color: #6b4d16; padding: .6rem .9rem; border-radius: 6px; font-size: .85rem; margin-bottom: 1rem; }
  .errore-box { background: #fbe2e0; border: 1px solid #d98b84; color: #7a241d; padding: .6rem .9rem; border-radius: 6px; font-size: .85rem; margin-bottom: 1rem; }
  nav.percorso { font-size: .85rem; color: var(--inchiostro-tenue); margin-bottom: 1rem; }
  nav.percorso button { background: none; border: none; color: var(--accento); cursor: pointer; font: inherit; padding: 0; text-decoration: underline; }
  .elenco { display: grid; gap: .5rem; }
  .scelta { text-align: left; background: #fff; border: 1px solid var(--riga); border-radius: 8px; padding: .75rem .9rem; cursor: pointer; font: inherit; color: inherit; box-shadow: var(--ombra); }
  .scelta:hover { border-color: var(--accento); }
  .scelta .tit { font-weight: 600; } .scelta .sub { color: var(--inchiostro-tenue); font-size: .85rem; }
  .form-carta { background: #fff; border: 1px solid var(--riga); border-radius: 8px; padding: 1.1rem 1.2rem; box-shadow: var(--ombra); max-width: 380px; margin: 3rem auto; }
  .form-carta h2 { margin-top: 0; }
  .form-carta label { display: block; font-size: .8rem; color: var(--inchiostro-tenue); margin: .6rem 0 .2rem; }
  .form-carta input, .form-carta select { width: 100%; padding: .5rem .6rem; border: 1px solid var(--riga); border-radius: 5px; font: inherit; }
  button.azione { background: var(--accento); color: #fff; border: none; border-radius: 6px; padding: .5rem 1rem; font: inherit; cursor: pointer; margin-top: .8rem; }
  button.azione:disabled { opacity: .6; cursor: default; }
  table.griglia { border-collapse: collapse; width: 100%; background: #fff; border-radius: 8px; box-shadow: var(--ombra); }
  .griglia-scroll { overflow-x: auto; border-radius: 8px; }
  table.griglia th, table.griglia td { border-bottom: 1px solid var(--riga); padding: .5rem .55rem; text-align: center; }
  table.griglia th { background: var(--carta-scura); font-weight: 600; font-size: .78rem; }
  table.griglia td.alunno, table.griglia th.alunno { text-align: left; position: sticky; left: 0; background: #fff; min-width: 9rem; }
  table.griglia th.alunno { background: var(--carta-scura); }
  select.cella { width: 4.2rem; padding: .25rem; }
  td.esito { font-size: .8rem; color: var(--inchiostro-tenue); white-space: nowrap; text-align: left; }
  .barra-sezioni { margin: 0 0 1rem; display: flex; gap: .5rem; flex-wrap: wrap; }
  details.nucleo { background: #fff; border: 1px solid var(--riga); border-radius: 8px; box-shadow: var(--ombra); margin-bottom: .6rem; }
  details.nucleo > summary { cursor: pointer; padding: .7rem .9rem; font-weight: 600; }
  details.nucleo .corpo-nucleo { padding: 0 .9rem .8rem; }
  .corpo-nucleo table { width: 100%; border-collapse: collapse; font-size: .85rem; margin-top: .3rem; }
  .corpo-nucleo th, .corpo-nucleo td { text-align: left; padding: .35rem .5rem; border-bottom: 1px dotted var(--riga); }
  .corpo-nucleo th { font-weight: 600; color: var(--inchiostro-tenue); font-size: .78rem; }
  .badge { display: inline-block; padding: .1rem .5rem; border-radius: 10px; background: var(--carta-scura); font-size: .75rem; margin-left: .4rem; }
  .form-attivita { background: #fff; border: 1px solid var(--riga); border-radius: 8px; padding: 1rem 1.1rem; margin-bottom: 1.25rem; box-shadow: var(--ombra); }
  .form-attivita .campi { display: grid; grid-template-columns: 2fr 1fr 1.6fr auto; gap: .6rem; align-items: end; }
  .form-attivita label { display: block; font-size: .78rem; color: var(--inchiostro-tenue); margin-bottom: .2rem; }
  .form-attivita input, .form-attivita select { width: 100%; padding: .4rem .5rem; border: 1px solid var(--riga); border-radius: 5px; font: inherit; }
  @media (max-width: 720px) { .form-attivita .campi { grid-template-columns: 1fr; } }
  .griglia-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: .8rem; margin-top: 1rem; }
  .card { background: #fff; border: 1px solid var(--riga); border-radius: 8px; padding: 1rem; box-shadow: var(--ombra); }
  .card h3 { margin: 0 0 .4rem; font-size: .95rem; }
  .card p { margin: 0 0 .6rem; color: var(--inchiostro-tenue); font-size: .85rem; }
  .sezione-titolo { font-size: 1.05rem; font-weight: 600; margin: 1.4rem 0 .6rem; }
  .sezione-titolo:first-child { margin-top: 0; }
  table.semplice { width: 100%; border-collapse: collapse; background: #fff; border-radius: 8px; box-shadow: var(--ombra); }
  table.semplice th, table.semplice td { text-align: left; padding: .5rem .6rem; border-bottom: 1px solid var(--riga); font-size: .88rem; }
  table.semplice th { background: var(--carta-scura); font-size: .78rem; }
  /* --- Report pedagogico dello studente --- */
  .tenue { color: var(--inchiostro-tenue); } .piccola { font-size: .78rem; }
  .report-testa { margin-bottom: 1rem; }
  .report-testa .sopratitolo { text-transform: uppercase; letter-spacing: .08em; font-size: .75rem; color: var(--inchiostro-tenue); font-weight: 600; }
  .report-testa h2 { margin: .1rem 0 .3rem; font-size: 1.4rem; }
  .report-testa .contesto { display: flex; gap: .4rem 1.2rem; flex-wrap: wrap; font-size: .9rem; }
  .report-testa .nota-perimetro { margin-top: .3rem; font-size: .78rem; color: var(--inchiostro-tenue); }
  .scheda { background: #fff; border: 1px solid var(--riga); border-radius: 8px; box-shadow: var(--ombra); padding: 1rem 1.1rem; margin-bottom: 1rem; }
  .pastiglia { display: inline-block; padding: .12rem .6rem; border-radius: 999px; border: 1px solid var(--riga); font-size: .78rem; font-weight: 600; white-space: nowrap; }
  .pastiglia.neutra { background: var(--carta-scura); color: var(--inchiostro-tenue); border-style: dashed; font-weight: 500; }
  .complessivo { display: flex; gap: 1rem 2rem; flex-wrap: wrap; align-items: center; }
  .complessivo .principale { display: flex; flex-direction: column; align-items: flex-start; gap: .25rem; min-width: 11rem; }
  .complessivo .titolo, .lettura-nuclei .titolo { font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; color: var(--inchiostro-tenue); font-weight: 600; }
  .complessivo .numero { font-size: 2.2rem; font-weight: 700; line-height: 1.1; }
  .complessivo .dettagli { flex: 1 1 18rem; display: flex; flex-direction: column; gap: .25rem; font-size: .88rem; }
  .complessivo .dettagli .tenue { font-size: .8rem; }
  .grafico-nuclei { display: flex; gap: 1rem 1.5rem; flex-wrap: wrap; align-items: flex-start; }
  .grafico-nuclei .grafico { flex: 1 1 22rem; min-width: 0; }
  .lettura-nuclei { flex: 1 1 14rem; display: flex; flex-direction: column; gap: .35rem; }
  .lettura-nuclei .voce { display: flex; gap: .5rem; align-items: baseline; font-size: .88rem; flex-wrap: wrap; }
  .lettura-nuclei .voce .simbolo { width: 1rem; text-align: center; }
  .lettura-nuclei .voce .nome { font-weight: 600; }
  svg.radar { width: 100%; max-width: 32rem; height: auto; display: block; margin: 0 auto; }
  svg.radar .bordo { fill: none; stroke: #b9b39f; stroke-width: 1; }
  svg.radar .anello { fill: none; stroke: #d8d3c3; stroke-width: .8; stroke-dasharray: 2 3; }
  svg.radar .asse { stroke: #b9b39f; stroke-width: .8; }
  svg.radar .asse.non-valutato { stroke-dasharray: 4 4; stroke: #c9c4b3; }
  svg.radar .area { fill: rgba(47, 77, 58, .12); stroke: none; }
  svg.radar .lato { stroke: var(--accento); stroke-width: 2; }
  svg.radar .lato.tratteggiato { stroke-dasharray: 5 4; }
  svg.radar .punto { stroke-width: 2; }
  svg.radar .etichetta-asse { font-size: 10.5px; fill: var(--inchiostro); }
  svg.radar .etichetta-asse .valore { fill: var(--inchiostro-tenue); font-size: 9.5px; }
  svg.radar .etichetta-anello { font-size: 7px; fill: #8a8c84; }
  .legenda-radar { margin-top: .4rem; text-align: center; }
  .barre-nuclei { display: flex; flex-direction: column; gap: .6rem; }
  .barra-nucleo { display: grid; grid-template-columns: minmax(7rem, 1.2fr) 3fr 6.5rem; gap: .6rem; align-items: center; font-size: .88rem; }
  .barra-nucleo .nome { font-weight: 600; }
  .barra-nucleo .traccia { position: relative; height: .9rem; background: var(--carta-scura); border-radius: 4px; overflow: hidden; }
  .barra-nucleo .traccia.vuota { background: none; border: 1px dashed #b9b39f; }
  .barra-nucleo .traccia b { position: absolute; left: 0; top: 0; bottom: 0; }
  .barra-nucleo .traccia .tacca { position: absolute; top: 0; bottom: 0; width: 1px; background: #8a8c84; z-index: 1; }
  details.nucleo > summary { display: flex; gap: .4rem .7rem; flex-wrap: wrap; align-items: center; }
  details.nucleo > summary .nome { flex: 1 1 12rem; }
  details.nucleo > summary .dato { font-weight: 600; font-size: .88rem; }
  details.nucleo > summary .dato.tenue { font-weight: 400; font-size: .8rem; }
  .riga-dato { font-size: .86rem; margin-top: .25rem; }
  .criterio-report { border-top: 1px solid var(--riga); padding: .7rem 0 .5rem; }
  .criterio-report .intestazione { display: flex; gap: .3rem .6rem; flex-wrap: wrap; align-items: baseline; }
  .criterio-report .intestazione span:nth-child(2) { flex: 1 1 12rem; }
  .criterio-report .copertura { font-weight: 600; }
  .finestra { display: flex; gap: .35rem; flex-wrap: wrap; align-items: center; margin-top: .4rem; font-size: .8rem; }
  .finestra .etichetta { color: var(--inchiostro-tenue); }
  .finestra .chip { background: #eef3ee; border: 1px solid #b9cbbd; border-radius: 6px; padding: .1rem .45rem; font-weight: 600; }
  details.storico { margin-top: .45rem; }
  details.storico > summary { cursor: pointer; font-size: .82rem; color: var(--accento); }
  .corpo-nucleo tr.nella-media td { font-weight: 600; }
  .corpo-nucleo tr.non-conteggiata td { color: #8a8c84; font-style: italic; }
  @media (max-width: 640px) { .barra-nucleo { grid-template-columns: 1fr; gap: .2rem; } .complessivo .numero { font-size: 1.8rem; } }
</style>
</head>
<body>
<header class="app" id="intestazione" style="display:none">
  <h1>Osservazioni pedagogiche</h1>
  <span class="filo" id="filoUtente"></span>
  <select id="selectTenant"></select>
  <button class="link" id="bottoneLogout">Esci</button>
</header>
<nav class="principale" id="navPrincipale" style="display:none"></nav>
<main>
  <div id="erroreGlobale"></div>
  <nav class="percorso" id="percorso"></nav>
  <div id="contenuto">Caricamento…</div>
</main>

<script src="radar.js"></script>
<script>
'use strict';

const stato = { me: null, sezioneAttiva: null };

function el(tag, props, figli) {
  const nodo = document.createElement(tag);
  Object.assign(nodo, props || {});
  (figli || []).forEach((f) => nodo.append(f));
  return nodo;
}

async function api(percorso, opzioni) {
  const risposta = await fetch('/api' + percorso, {
    ...opzioni,
    headers: {
      'Content-Type': 'application/json',
      ...(stato.me && stato.me.csrfToken ? { 'X-CSRF-Token': stato.me.csrfToken } : {}),
      ...(opzioni && opzioni.headers),
    },
  });
  if (!risposta.ok) {
    const corpo = await risposta.json().catch(() => ({}));
    const errore = new Error(corpo.errore || ('Errore HTTP ' + risposta.status));
    errore.status = risposta.status;
    throw errore;
  }
  return risposta.status === 204 ? null : risposta.json();
}

function mostraErrore(messaggio) {
  document.getElementById('erroreGlobale').innerHTML = '';
  if (messaggio) document.getElementById('erroreGlobale').append(el('div', { className: 'errore-box', textContent: messaggio }));
}

function numeroIt(v) { return v === null || v === undefined ? '—' : Number(v).toLocaleString('it-IT', { maximumFractionDigits: 2 }); }
function testoEsito(esito) { return esito.percentuale === null ? 'Non valutato' : `${numeroIt(esito.percentuale)}% · ${esito.giudizio || ''}`; }

/** true se l'account ha `codice` tra i permessi effettivi nel tenant attivo (sez. RBAC: mai un controllo "a occhio" lato UI sui dati, solo sulla VISIBILITÀ di scorciatoie — il backend rivaluta sempre). */
function haPermesso(codice) { return !!(stato.me && stato.me.permessiNelTenantAttivo && stato.me.permessiNelTenantAttivo.includes(codice)); }

/** I RoleAssignment con scope_type=SCHOOL_LEVEL dell'utente nel tenant attivo (un Coordinatore ne ha uno). */
function ruoliSchoolLevel() { return (stato.me.ruoliNelTenantAttivo || []).filter((r) => r.scope_type === 'SCHOOL_LEVEL'); }

// --- Schermata di login ------------------------------------------------

function mostraLogin() {
  document.getElementById('intestazione').style.display = 'none';
  document.getElementById('navPrincipale').style.display = 'none';
  document.getElementById('percorso').innerHTML = '';
  const email = el('input', { type: 'email', placeholder: 'nome@istituto.test', required: true });
  const password = el('input', { type: 'password', required: true });
  const erroreForm = el('div', { className: 'errore-box', style: 'display:none' });
  const bottone = el('button', { className: 'azione', type: 'submit', textContent: 'Accedi' });
  const form = el('form', {
    className: 'form-carta',
    onsubmit: async (evento) => {
      evento.preventDefault();
      erroreForm.style.display = 'none';
      bottone.disabled = true;
      try {
        const corpo = await api('/auth/login', { method: 'POST', body: JSON.stringify({ email: email.value, password: password.value }) });
        stato.me = corpo;
        avviaApp();
      } catch (errore) {
        erroreForm.textContent = errore.message;
        erroreForm.style.display = 'block';
        bottone.disabled = false;
      }
    },
  }, [
    el('h2', { textContent: 'Accedi' }),
    el('label', { textContent: 'Email' }), email,
    el('label', { textContent: 'Password' }), password,
    erroreForm, bottone,
  ]);
  document.getElementById('contenuto').innerHTML = '';
  document.getElementById('contenuto').append(form);
}

// --- Intestazione con tenant attivo/switch, navigazione principale ---------

function aggiornaIntestazione() {
  const header = document.getElementById('intestazione');
  header.style.display = 'flex';
  document.getElementById('filoUtente').textContent =
    `${stato.me.account.nome} ${stato.me.account.cognome}${stato.me.isPlatformAdmin ? ' · PLATFORM_ADMIN' : ''}`;
  const select = document.getElementById('selectTenant');
  select.innerHTML = '';
  select.append(el('option', { value: '', textContent: 'Nessun tenant attivo' }));
  stato.me.tenantsDisponibiliPerSwitch.forEach((t) => {
    const id = t.tenant_id ?? t.id;
    select.append(el('option', { value: id, textContent: t.nome, selected: id === stato.me.activeTenantId }));
  });
  select.onchange = async () => {
    if (!select.value) return;
    try {
      // Il cambio tenant ricarica sempre /auth/me (nuovi permessi/ruoli) e riparte dalla Dashboard:
      // nessuno stato del tenant precedente (teaching/classe/attività aperti) sopravvive allo switch.
      stato.me = await api('/auth/switch-tenant', { method: 'POST', body: JSON.stringify({ tenantId: Number(select.value) }) });
      avviaApp();
    } catch (errore) { mostraErrore(errore.message); }
  };
}

const VOCI_NAV = [
  { id: 'dashboard', etichetta: 'Dashboard', azione: () => mostraDashboard() },
  { id: 'teachings', etichetta: 'Insegnamenti', azione: () => mostraTeachings() },
  { id: 'classi', etichetta: 'Classi', azione: () => avviaClassi() },
  { id: 'studenti', etichetta: 'Studenti', azione: () => avviaStudenti() },
  { id: 'osservazioni', etichetta: 'Osservazioni', azione: () => avviaOsservazioni() },
  { id: 'valutazioni', etichetta: 'Valutazioni', azione: () => avviaValutazioni() },
];

function aggiornaNavPrincipale() {
  const nav = document.getElementById('navPrincipale');
  if (!stato.me.activeTenantId) { nav.style.display = 'none'; return; }
  nav.style.display = 'flex';
  nav.innerHTML = '';
  VOCI_NAV.forEach((voce) => {
    nav.append(el('button', {
      textContent: voce.etichetta,
      className: stato.sezioneAttiva === voce.id ? 'attiva' : '',
      onclick: () => { stato.sezioneAttiva = voce.id; aggiornaNavPrincipale(); voce.azione(); },
    }));
  });
  // Amministrazione: SOLO se il ruolo lo consente (PLATFORM_ADMIN in questa V1).
  if (stato.me.isPlatformAdmin) {
    nav.append(el('button', {
      textContent: 'Amministrazione',
      className: stato.sezioneAttiva === 'admin' ? 'attiva' : '',
      onclick: () => { stato.sezioneAttiva = 'admin'; aggiornaNavPrincipale(); mostraPannelloPlatform(); },
    }));
  }
}

document.getElementById('bottoneLogout').addEventListener('click', async () => {
  await api('/auth/logout', { method: 'POST' }).catch(() => {});
  stato.me = null;
  mostraLogin();
});

async function avviaApp() {
  aggiornaIntestazione();
  aggiornaNavPrincipale();
  if (stato.me.activeTenantId) { stato.sezioneAttiva = 'dashboard'; aggiornaNavPrincipale(); mostraDashboard(); }
  else mostraSceltaTenant();
}

function mostraSceltaTenant() {
  impostaPercorso([{ testo: 'Osservazioni pedagogiche' }]);
  document.getElementById('contenuto').innerHTML = '';
  document.getElementById('contenuto').append(
    el('p', { textContent: 'Seleziona un tenant attivo dal menu in alto per iniziare.' })
  );
  if (stato.me.isPlatformAdmin) mostraPannelloPlatform();
}

async function mostraPannelloPlatform() {
  impostaPercorso([{ testo: 'Amministrazione' }]);
  const contenuto = document.getElementById('contenuto');
  contenuto.textContent = 'Caricamento…';
  try {
    const tenants = await api('/platform/tenants');
    contenuto.innerHTML = '';
    const box = el('div', { className: 'form-attivita' }, [el('h2', { textContent: 'Tenant della piattaforma' })]);
    const lista = el('div', { className: 'elenco' });
    tenants.forEach((t) => lista.append(el('div', { className: 'scelta' }, [
      el('div', { className: 'tit', textContent: t.nome }), el('div', { className: 'sub', textContent: `${t.slug} · ${t.stato}` }),
    ])));
    box.append(lista);
    contenuto.append(box);
  } catch (errore) { contenuto.textContent = ''; mostraErrore(errore.message); }
}

// --- Percorso di navigazione (breadcrumb generico) --------------------------

function impostaPercorso(voci) {
  const box = document.getElementById('percorso');
  box.innerHTML = '';
  voci.forEach((voce, i) => {
    if (i > 0) box.append(document.createTextNode(' › '));
    box.append(voce.onclick ? el('button', { textContent: voce.testo, onclick: voce.onclick }) : el('span', { textContent: voce.testo }));
  });
}
const CROCE_DASHBOARD = { testo: 'Dashboard', onclick: () => mostraDashboard() };

// --- Dashboard (coerente col ruolo) -----------------------------------------

async function mostraDashboard() {
  mostraErrore(null);
  impostaPercorso([{ testo: 'Dashboard' }]);
  const contenuto = document.getElementById('contenuto');
  contenuto.textContent = 'Caricamento…';
  try {
    const teachings = await api('/teachings');
    contenuto.innerHTML = '';
    const ruoli = stato.me.ruoliNelTenantAttivo || [];
    const nomiRuoli = [...new Set(ruoli.map((r) => r.ruolo))];
    contenuto.append(el('h2', { textContent: `Benvenuto/a, ${stato.me.account.nome}` }));
    contenuto.append(el('p', {
      className: 'sub',
      style: 'color:var(--inchiostro-tenue);margin-top:-.5rem',
      textContent: nomiRuoli.length ? `Ruolo/i in questo tenant: ${nomiRuoli.join(', ')}` : 'Nessun ruolo assegnato in questo tenant.',
    }));

    const cards = el('div', { className: 'griglia-cards' });
    cards.append(el('div', { className: 'card' }, [
      el('h3', { textContent: 'Insegnamenti' }),
      el('p', { textContent: teachings.length ? `${teachings.length} Teaching assegnati.` : 'Nessun Teaching assegnato in questo tenant.' }),

/**
 * Percorso di un Teaching raggiunto dalla navigazione per materia (teaching.viaMateria):
 * Dashboard › Insegnamenti › materia › classe › ... Per gli altri ingressi (Osservazioni, ecc.)
 * resta il percorso "Osservazioni › materia — classe".
 */
function percorsoTeaching(teaching, coda) {
  const base = teaching.viaMateria
    ? [CROCE_DASHBOARD, { testo: 'Insegnamenti', onclick: () => mostraTeachings() }, { testo: teaching.materia, onclick: () => mostraClassiDiMateria(teaching.materia) }]
    : [CROCE_DASHBOARD, { testo: 'Osservazioni' }];
  const etichetta = teaching.viaMateria ? teaching.classe : `${teaching.materia} — ${teaching.classe}`;
  if (!coda || coda.length === 0) return [...base, { testo: etichetta }];
  return [...base, { testo: etichetta, onclick: () => mostraActivities(teaching) }, ...coda];
}

/**
 * Decide da dove far partire la navigazione di Classi/Studenti/Osservazioni/Valutazioni:
 * - un Coordinatore (scope SCHOOL_LEVEL) parte direttamente dal proprio livello;
 * - chi ha class.read più ampio (Tenant Admin/Platform Admin) sceglie prima il livello;
 * - un Docente (nessun class.read) parte dai propri Teaching.
 * Questa è SOLO una scorciatoia di navigazione: l'autorizzazione reale è sempre
 * rivalutata dal backend a ogni chiamata (sez. 7 del task).
 */
function risolviIngresso() {
  const livello = ruoliSchoolLevel()[0];
  if (livello) return { tipo: 'LIVELLO', schoolLevelId: livello.scope_school_level_id };
  if (haPermesso('class.read')) return { tipo: 'SCEGLI_LIVELLO' };
  return { tipo: 'DOCENTE' };
}

async function avviaClassi() {
  const ingresso = risolviIngresso();
  if (ingresso.tipo === 'LIVELLO') return mostraClassiDelLivello(ingresso.schoolLevelId);
  if (ingresso.tipo === 'SCEGLI_LIVELLO') return mostraSceltaLivello((liv) => mostraClassiDelLivello(liv.id));
  return mostraClassiDaTeaching();
}

async function avviaStudenti() {
  const ingresso = risolviIngresso();
  if (ingresso.tipo === 'LIVELLO') return mostraClassiDelLivello(ingresso.schoolLevelId, 'studenti');
  if (ingresso.tipo === 'SCEGLI_LIVELLO') return mostraSceltaLivello((liv) => mostraClassiDelLivello(liv.id, 'studenti'));
  return mostraSceltaTeachingPer('Studenti', (t) => mostraStudentiDiTeaching(t));
}

async function avviaOsservazioni() {
  const ingresso = risolviIngresso();
  if (ingresso.tipo === 'LIVELLO') return mostraClassiDelLivello(ingresso.schoolLevelId, 'osservazioni');
  if (ingresso.tipo === 'SCEGLI_LIVELLO') return mostraSceltaLivello((liv) => mostraClassiDelLivello(liv.id, 'osservazioni'));
  return mostraSceltaTeachingPer('Osservazioni', (t) => mostraActivities(t));
}

async function avviaValutazioni() {
  const ingresso = risolviIngresso();
  if (ingresso.tipo === 'LIVELLO') return mostraClassiDelLivello(ingresso.schoolLevelId, 'valutazioni');
  if (ingresso.tipo === 'SCEGLI_LIVELLO') return mostraSceltaLivello((liv) => mostraClassiDelLivello(liv.id, 'valutazioni'));
  return mostraSceltaTeachingPer('Valutazioni', (t) => mostraValutazioniDiTeaching(t));
}

// --- Report pedagogico di uno studente ------------------------------------------------------
//
// SOLO presentazione: percentuali, giudizi, media mobile, cumulativo, copertura, confronto tra
// nuclei e posizioni del radar arrivano già calcolati dal server
// (GET /teachings/:id/students/:enrollmentId/progress). Scala, etichette e bande sono quelle
// dell'istituto: qui non compare alcun valore di scala né alcuna soglia.

const LIVELLI_COPERTURA = [
  { simbolo: '○', testo: 'Non valutato' },
  { simbolo: '◔', testo: 'Indicativo' },
  { simbolo: '◑', testo: 'Provvisorio' },
  { simbolo: '●', testo: 'Consolidato' },
];
const CONFRONTI_NUCLEO = {
  punto_di_forza: { simbolo: '▲', testo: 'Punto di forza' },
  area_di_attenzione: { simbolo: '▼', testo: 'Area di attenzione' },
  nella_norma: { simbolo: '=', testo: 'Nella norma' },
};
const MOTIVI_ESCLUSIONE = {
  attivita_disattivata: 'attività disattivata',
  scala_non_compatibile: 'scala diversa da quella in uso',
  criterio_non_attivo: 'criterio non più attivo',
};
const SVG_NS = 'http://www.w3.org/2000/svg';

function svg(tag, attributi, figli) {
  const nodo = document.createElementNS(SVG_NS, tag);
  Object.entries(attributi || {}).forEach(([nome, valore]) => nodo.setAttribute(nome, valore));
  (figli || []).forEach((f) => nodo.append(f));
  return nodo;
}

/** Tinta di una banda di giudizio dalla sua posizione tra le bande ricevute (qualunque numero ed etichetta). */
function tintaBanda(livello, numeroBande) {
  if (livello === null || livello === undefined) return null;
  const quota = numeroBande > 1 ? livello / (numeroBande - 1) : 1;
  return Math.round(8 + quota * 132);
}

/** Pastiglia del giudizio: il colore accompagna sempre l'etichetta testuale, non la sostituisce. */
function pastigliaGiudizio(risultato, numeroBande) {
  if (risultato.percentuale === null || risultato.percentuale === undefined) {
    return el('span', { className: 'pastiglia neutra', textContent: 'Non valutato' });
  }
  const tinta = tintaBanda(risultato.livelloGiudizio, numeroBande);
  const pastiglia = el('span', { className: 'pastiglia', textContent: risultato.giudizio || '—' });
  if (tinta !== null) pastiglia.style.cssText = `background:hsl(${tinta} 62% 90%);color:hsl(${tinta} 70% 22%);border-color:hsl(${tinta} 45% 60%)`;
  return pastiglia;
}

function testoPercentuale(valore) {
  return valore === null || valore === undefined ? 'Non valutato' : `${numeroIt(valore)}%`;
}

function testoCopertura(copertura) {
  return [
    ['consolidati', 3, 'consolidati'], ['provvisori', 2, 'provvisori'], ['indicativi', 1, 'indicativi'], ['nonValutati', 0, 'non valutati'],
  ].map(([chiave, livello, testo]) => `${LIVELLI_COPERTURA[livello].simbolo} ${copertura[chiave]} ${testo}`).join(' · ');
}

function dataIt(giorno) {
  return new Date(giorno + 'T00:00:00').toLocaleDateString('it-IT');
}

function testoValore(osservazione) {
  return osservazione.etichetta ? `${osservazione.valore} · ${osservazione.etichetta}` : String(osservazione.valore);
}

/** Nome dell'asse su al più due righe, per non uscire dal grafico. */
function righeEtichetta(nome) {
  const massimo = 18;
  const righe = [''];
  nome.split(/\s+/).forEach((parola) => {
    const ultima = righe[righe.length - 1];
    if (!ultima) righe[righe.length - 1] = parola;
    else if ((ultima + ' ' + parola).length <= massimo) righe[righe.length - 1] = ultima + ' ' + parola;
    else righe.push(parola);
  });
  if (righe.length <= 2) return righe;
  return [righe[0], righe[1].slice(0, massimo - 1) + '…'];
}

/** Radar dei nuclei (3 o più) oppure barre (meno di 3): geometria da radar.js, valori dal server. */
function costruisciGraficoNuclei(p) {
  const numeroBande = p.bande.length;
  const g = RadarNuclei.geometria({
    assi: p.nuclei.map((n) => ({ id: n.id, posizione: n.radar.posizioneRadar, pieno: n.radar.puntoPieno })),
    bande: p.bande.map((b) => ({ etichetta: b.etichetta, posizione: b.posizioneRadar })),
  });
  const coloreNucleo = (n) => {
    const tinta = tintaBanda(n.risultatoCorrente.livelloGiudizio, numeroBande);
    return tinta === null ? '#8a8c84' : `hsl(${tinta} 60% 32%)`;
  };

  if (g.modalita === 'barre') {
    const barre = el('div', { className: 'barre-nuclei' });
    p.nuclei.forEach((n, i) => {
      const asse = g.assi[i];
      const traccia = el('div', { className: 'traccia' + (asse.valutato ? '' : ' vuota') });
      g.anelli.forEach((a) => traccia.append(el('i', { className: 'tacca', style: `left:${a.posizione}%`, title: a.etichetta })));
      if (asse.valutato) {
        traccia.append(el('b', { style: `width:${asse.posizione}%;background:${coloreNucleo(n)};opacity:${asse.pieno ? 1 : .55}` }));
      }
      barre.append(el('div', { className: 'barra-nucleo' }, [
        el('div', { className: 'nome', textContent: n.nome }),
        traccia,
        el('div', { className: 'valore', textContent: testoPercentuale(n.risultatoCorrente.percentuale) }),
      ]));
    });
    return barre;
  }

  // Riquadro calcolato dagli assi e dalle loro etichette (fino a 3 righe), così il grafico usa tutto lo spazio
  // con qualunque numero di nuclei.
  const larghezzaTesto = 118;
  const altezzaTesto = 38;
  const estremi = g.assi.map((a) => ({
    sinistra: a.etichetta.ancoraggio === 'end' ? a.etichetta.x - larghezzaTesto : (a.etichetta.ancoraggio === 'middle' ? a.etichetta.x - larghezzaTesto / 2 : a.etichetta.x),
    destra: a.etichetta.ancoraggio === 'start' ? a.etichetta.x + larghezzaTesto : (a.etichetta.ancoraggio === 'middle' ? a.etichetta.x + larghezzaTesto / 2 : a.etichetta.x),
    alto: a.etichetta.y - altezzaTesto,
    basso: a.etichetta.y + altezzaTesto,
  }));
  const sinistra = Math.min(-g.raggio, ...estremi.map((e) => e.sinistra)) - 6;
  const destra = Math.max(g.raggio, ...estremi.map((e) => e.destra)) + 6;
  const alto = Math.min(...estremi.map((e) => e.alto));
  const basso = Math.max(...estremi.map((e) => e.basso));
  const disegno = svg('svg', {
    viewBox: `${sinistra} ${alto} ${destra - sinistra} ${basso - alto}`, role: 'img', class: 'radar', 'aria-label': 'Radar dei nuclei tematici',
  });
  const poligono = (vertici) => vertici.map((v) => `${v.x},${v.y}`).join(' ');
  g.anelli.forEach((a) => {
    const anello = svg('polygon', { points: poligono(a.vertici), class: 'anello' });
    const titolo = svg('title');
    titolo.textContent = a.etichetta;
    anello.append(titolo);
    disegno.append(anello);
  });
  disegno.append(svg('polygon', { points: poligono(g.assi.map((a) => a.estremo)), class: 'bordo' }));
  g.assi.forEach((a) => disegno.append(svg('line', {
    x1: 0, y1: 0, x2: a.estremo.x, y2: a.estremo.y, class: 'asse' + (a.valutato ? '' : ' non-valutato'),
  })));
  // Riempimento solo se tutti i nuclei sono valutati: altrimenti il poligono è interrotto e resta aperto.
  if (g.assi.every((a) => a.valutato)) disegno.append(svg('polygon', { points: poligono(g.assi.map((a) => a.punto)), class: 'area' }));
  g.tratti.forEach((t) => disegno.append(svg('line', {
    x1: t.da.x, y1: t.da.y, x2: t.a.x, y2: t.a.y, class: 'lato' + (t.tratteggiato ? ' tratteggiato' : ''),
  })));
  g.assi.forEach((a, i) => {
    const n = p.nuclei[i];
    if (a.valutato) {
      const cerchio = svg('circle', { cx: a.punto.x, cy: a.punto.y, r: 5, class: 'punto', stroke: coloreNucleo(n), fill: a.pieno ? coloreNucleo(n) : '#fff' });
      const titolo = svg('title');
      titolo.textContent = `${n.nome}: ${testoPercentuale(n.risultatoCorrente.percentuale)} · ${n.risultatoCorrente.giudizio}`;
      cerchio.append(titolo);
      disegno.append(cerchio);
    }
    const righe = righeEtichetta(n.nome);
    righe.push(a.valutato ? `${testoPercentuale(n.risultatoCorrente.percentuale)} · ${n.risultatoCorrente.giudizio}` : 'Non valutato');
    const testo = svg('text', { x: a.etichetta.x, y: a.etichetta.y - (a.etichetta.y < -10 ? (righe.length - 1) * 12 : 0), 'text-anchor': a.etichetta.ancoraggio, class: 'etichetta-asse' });
    righe.forEach((riga, k) => {
      const tspan = svg('tspan', { x: a.etichetta.x, dy: k === 0 ? 0 : 12, class: k === righe.length - 1 ? 'valore' : '' });
      tspan.textContent = riga;
      testo.append(tspan);
    });
    disegno.append(testo);
  });
  return disegno;
}

function rigaStorico(o) {
  let stato;
  if (!o.conteggiata) stato = `non conteggiata: ${MOTIVI_ESCLUSIONE[o.motivoEsclusione] || o.motivoEsclusione}`;
  else stato = o.inRisultatoCorrente ? '✓ nella media corrente' : 'storica (fuori dalle ultime osservazioni)';
  return el('tr', { className: o.conteggiata ? (o.inRisultatoCorrente ? 'nella-media' : '') : 'non-conteggiata' }, [
    el('td', { textContent: dataIt(o.dataOsservazione) }),
    el('td', { textContent: o.attivita }),
    el('td', { textContent: testoValore(o) }),
    el('td', { textContent: o.percentuale === null || o.percentuale === undefined ? '—' : `${numeroIt(o.percentuale)}%` }),
    el('td', { textContent: o.nota || '—' }),
    el('td', { textContent: stato }),
  ]);
}

function tabellaStorico(osservazioni) {
  const tabella = el('table', {}, [el('tr', {}, ['Data', 'Attività', 'Valore', '%', 'Nota', 'Nel risultato corrente'].map((t) => el('th', { textContent: t })))]);
  osservazioni.forEach((o) => tabella.append(rigaStorico(o)));
  return el('div', { className: 'griglia-scroll' }, [tabella]);
}

function bloccoCriterio(criterio, p) {
  const r = criterio.risultatoCorrente;
  const copertura = LIVELLI_COPERTURA[criterio.livelloCopertura];
  const blocco = el('div', { className: 'criterio-report' }, [
    el('div', { className: 'intestazione' }, [
      el('strong', { textContent: criterio.codice }),
      el('span', { textContent: criterio.descrizione }),
      pastigliaGiudizio(r, p.bande.length),
    ]),
  ]);
  if (r.percentuale === null) {
    blocco.append(el('div', { className: 'riga-dato', textContent: `${copertura.simbolo} Non valutato: nessuna osservazione valida su questo criterio.` }));
  } else {
    const quante = r.osservazioniConsiderate < r.osservazioniTotali
      ? `ultime ${r.osservazioniConsiderate} di ${r.osservazioniTotali} osservazioni`
      : (r.osservazioniTotali === 1 ? '1 osservazione' : `tutte le ${r.osservazioniTotali} osservazioni`);
    blocco.append(el('div', { className: 'riga-dato' }, [
      el('strong', { textContent: `Risultato corrente: ${numeroIt(r.percentuale)}%` }),
      document.createTextNode(` · media ${numeroIt(r.media)} (scala ${p.scala.valoreMinimo}–${p.scala.valoreMassimo}) · ${quante}`),
    ]));
    blocco.append(el('div', { className: 'riga-dato' }, [
      el('span', { className: 'copertura', textContent: `${copertura.simbolo} ${copertura.testo}` }),
      document.createTextNode(` · Cumulativo da inizio anno: ${numeroIt(criterio.cumulativo.percentuale)}% · ${criterio.cumulativo.giudizio}`),
    ]));
    const finestra = criterio.osservazioni.filter((o) => o.inRisultatoCorrente);
    blocco.append(el('div', { className: 'finestra' }, [
      el('span', { className: 'etichetta', textContent: 'Nella media corrente:' }),
      ...finestra.map((o) => el('span', { className: 'chip', textContent: `${dataIt(o.dataOsservazione)} · ${testoValore(o)}`, title: o.attivita })),
    ]));
  }
  if (criterio.osservazioni.length > 0) {
    blocco.append(el('details', { className: 'storico' }, [
      el('summary', { textContent: `Mostra storico (${criterio.osservazioni.length})` }),
      tabellaStorico(criterio.osservazioni),
    ]));
  }
  return blocco;
}

function bloccoNucleo(nucleo, p) {
  const r = nucleo.risultatoCorrente;
  const confronto = CONFRONTI_NUCLEO[nucleo.confrontoConComplessivo];
  const sintesi = [
    el('span', { className: 'nome', textContent: nucleo.nome }),
    pastigliaGiudizio(r, p.bande.length),
    el('span', { className: 'dato', textContent: r.percentuale === null ? '' : `${numeroIt(r.percentuale)}%` }),
    el('span', { className: 'dato tenue', textContent: `${r.criteriValutati}/${r.criteriTotali} criteri valutati` }),
  ];
  if (confronto) sintesi.push(el('span', { className: 'dato tenue', textContent: `${confronto.simbolo} ${confronto.testo}` }));

  const corpo = el('div', { className: 'corpo-nucleo' });
  if (nucleo.grigliaNonConfigurata) {
    corpo.append(el('p', { textContent: 'Nessun criterio configurato per questo nucleo.' }));
  } else {
    corpo.append(el('div', { className: 'riga-dato tenue', textContent: `Copertura: ${testoCopertura(nucleo.copertura)}` }));
    if (r.percentuale !== null) {
      corpo.append(el('div', {
        className: 'riga-dato tenue',
        textContent: `Cumulativo da inizio anno: ${numeroIt(nucleo.cumulativo.percentuale)}% · ${nucleo.cumulativo.giudizio}`,
      }));
    }
    nucleo.criteri.forEach((criterio) => corpo.append(bloccoCriterio(criterio, p)));
  }
  return el('details', { className: 'nucleo' }, [el('summary', {}, sintesi), corpo]);
}

async function mostraProgressoStudente(teaching, studente) {

    contenuto.innerHTML = '';
    contenuto.append(el('div', { className: 'barra-sezioni' }, [
      el('button', { className: 'azione', textContent: '← Torna agli studenti', onclick: () => mostraStudentiDiTeaching(teaching) }),
    ]));

    // 1. Intestazione
    contenuto.append(el('div', { className: 'report-testa' }, [
      el('div', { className: 'sopratitolo', textContent: 'Report pedagogico' }),
      el('h2', { textContent: `${p.alunno.cognome} ${p.alunno.nome}` }),
      el('div', { className: 'contesto' }, [
        el('span', { textContent: `Classe: ${p.teaching.classe}` }),
        el('span', { textContent: `Materia: ${p.teaching.materia}` }),
        el('span', { textContent: `Anno scolastico: ${p.teaching.annoScolastico || '—'}` }),
      ]),
      el('div', { className: 'nota-perimetro', textContent: 'Solo le osservazioni registrate nelle attività attive di questo insegnamento.' }),
    ]));

    // 2. Risultato complessivo
    const c = p.complessivo;
    contenuto.append(el('div', { className: 'scheda complessivo' }, [
      el('div', { className: 'principale' }, [
        el('div', { className: 'titolo', textContent: 'Risultato complessivo' }),
        el('div', { className: 'numero', textContent: testoPercentuale(c.percentuale) }),
        pastigliaGiudizio(c, numeroBande),
      ]),
      el('div', { className: 'dettagli' }, [
        el('div', { textContent: `${c.criteriValutati === 1 ? '1 criterio valutato' : `${c.criteriValutati} criteri valutati`} su ${c.criteriTotali}` }),
        el('div', { className: 'tenue', textContent: `Copertura: ${testoCopertura(c.copertura)}` }),
        el('div', {
          className: 'tenue',
          textContent: c.cumulativo.percentuale === null
            ? 'Cumulativo da inizio anno: non disponibile.'
            : `Cumulativo da inizio anno (tutte le osservazioni valide, dato secondario): ${numeroIt(c.cumulativo.percentuale)}% · ${c.cumulativo.giudizio}`,
        }),
        el('div', {
          className: 'tenue',
          textContent: `Risultato corrente = media delle ultime ${p.regola.finestra} osservazioni di ogni criterio; nucleo e complessivo = media dei criteri valutati, a pesi uguali.`,
        }),
      ]),
    ]));

    if (p.nuclei.length === 0) {
      contenuto.append(el('p', { textContent: 'Nessun nucleo tematico configurato per questa materia.' }));
      return;
    }

    // 3. Radar dei nuclei + lettura (confronto tra i nuclei dello stesso studente)
    const lettura = el('div', { className: 'lettura-nuclei' }, [
      el('div', { className: 'titolo', textContent: 'Nuclei a confronto' }),
    ]);
    p.nuclei.forEach((n) => {
      const confronto = CONFRONTI_NUCLEO[n.confrontoConComplessivo];
      lettura.append(el('div', { className: 'voce' }, [
        el('span', { className: 'simbolo', textContent: confronto ? confronto.simbolo : '○' }),
        el('span', { className: 'nome', textContent: n.nome }),
        el('span', { className: 'tenue', textContent: confronto ? confronto.testo : 'Non valutato' }),
      ]));
    });
    lettura.append(el('div', {
      className: 'tenue piccola',
      textContent: 'Confronto tra i nuclei dello stesso studente rispetto al suo risultato complessivo: non è un giudizio sull\'alunno.',
    }));
    const aBarre = p.nuclei.length < RadarNuclei.MINIMO_ASSI_RADAR;
    contenuto.append(el('div', { className: 'scheda grafico-nuclei' }, [
      el('div', { className: 'grafico' }, [
        costruisciGraficoNuclei(p),
        el('div', {
          className: 'tenue piccola legenda-radar',
          textContent: aBarre
            ? 'Barra piena = tutti i criteri del nucleo valutati con almeno 3 osservazioni · barra attenuata = risultato parziale o provvisorio · '
              + 'riquadro tratteggiato = nucleo non valutato.'
            : '● tutti i criteri del nucleo valutati con almeno 3 osservazioni · ○ risultato parziale o provvisorio · '
              + 'asse tratteggiato = nucleo non valutato.',
        }),
        el('div', {
          className: 'tenue piccola legenda-radar',
          textContent: (aBarre ? 'Tacche di riferimento, da destra a sinistra' : 'Linee di riferimento, dall\'esterno verso il centro')
            + ' (soglie di giudizio dell\'istituto): '
            + p.bande.filter((b) => b.posizioneRadar !== null).map((b) => `${b.etichetta} da ${numeroIt(b.sogliaMinima)}%`).join(' · ') + '.',
        }),
      ]),
      lettura,
    ]));

    // 4. Nuclei (chiusi) -> criteri -> media mobile -> storico
    contenuto.append(el('div', { className: 'sezione-titolo', textContent: 'Nuclei tematici' }));
    p.nuclei.forEach((n) => contenuto.append(bloccoNucleo(n, p)));

    // 5. Criteri non più attivi: solo storico, nessun risultato
    if (p.criteriNonPiuAttivi.length > 0) {
      const corpo = el('div', { className: 'corpo-nucleo' }, [
        el('p', { className: 'tenue', textContent: 'Criteri disattivati dopo essere stati usati: non entrano in alcun risultato. Le osservazioni restano consultabili.' }),
      ]);
      p.criteriNonPiuAttivi.forEach((criterio) => corpo.append(el('div', { className: 'criterio-report' }, [
        el('div', { className: 'intestazione' }, [
          el('strong', { textContent: criterio.codice }),
          el('span', { textContent: `${criterio.descrizione} (${criterio.nucleo})` }),
        ]),
        tabellaStorico(criterio.osservazioni),
      ])));
      contenuto.append(el('details', { className: 'nucleo' }, [
        el('summary', {}, [el('span', { className: 'nome', textContent: `Criteri non più attivi (${p.criteriNonPiuAttivi.length})` })]),
        corpo,
      ]));
    }
  } catch (errore) { contenuto.textContent = ''; mostraErrore(errore.message); }
}

function costruisciFormNuovaActivity(teaching, unita) {
  const inputNome = el('input', { type: 'text', placeholder: 'Es. Numeri entro il cento', required: true });
  const inputData = el('input', { type: 'date', required: true });
  const selectUnita = el('select', { required: true }, [
    el('option', { value: '', textContent: unita.length ? "Scegli l'unità pedagogica…" : 'Nessuna unità configurata per questa materia' }),
    ...unita.map((u) => el('option', { value: u.id, textContent: u.nome })),
  ]);
  const erroreForm = el('div', { className: 'errore-form' });
  const bottone = el('button', { className: 'azione', type: 'submit', textContent: 'Crea attività' });
  return el('form', {
    className: 'form-attivita',
    onsubmit: async (evento) => {
      evento.preventDefault();
      erroreForm.textContent = '';
      if (!selectUnita.value) { erroreForm.textContent = "Scegliere un'unità pedagogica."; return; }
      bottone.disabled = true;
      try {
        await api(`/teachings/${teaching.teaching_id}/activities`, {
          method: 'POST',
          body: JSON.stringify({ nome: inputNome.value, dataAttivita: inputData.value, pedagogicalUnitId: Number(selectUnita.value) }),
        });
        mostraActivities(teaching);
      } catch (errore) { erroreForm.textContent = errore.message; bottone.disabled = false; }
    },
  }, [
    el('h2', { textContent: 'Nuova attività' }),
    el('div', { className: 'campi' }, [
      el('div', {}, [el('label', { textContent: 'Titolo' }), inputNome]),
      el('div', {}, [el('label', { textContent: 'Data' }), inputData]),
      el('div', {}, [el('label', { textContent: 'Unità pedagogica' }), selectUnita]),
      bottone,
    ]),
    erroreForm,
  ]);
}

async function mostraGriglia(attivitaRif, teaching) {
  mostraErrore(null);
  impostaPercorso(percorsoTeaching(teaching, [{ testo: attivitaRif.nome }]));
  const contenuto = document.getElementById('contenuto');
  contenuto.textContent = 'Caricamento…';
  try {
    const griglia = await api(`/activities/${attivitaRif.activity_id}/griglia`);
    contenuto.innerHTML = '';
    if (griglia.grigliaNonConfigurata) {
      contenuto.append(el('p', { textContent: "L'unità pedagogica non ha criteri configurati." }));
      return;
    }
    contenuto.append(el('div', { className: 'barra-sezioni' }, [
      el('button', { className: 'azione', textContent: 'Report classe', onclick: () => mostraReportClasse(attivitaRif, teaching) }),
    ]));
    const tabella = el('table', { className: 'griglia' });
    tabella.append(el('thead', {}, [el('tr', {}, [
      el('th', { className: 'alunno', textContent: 'Alunno' }),
      ...griglia.criteri.map((c) => el('th', { textContent: c.descrizione })),
      el('th', { textContent: 'Esito' }),
    ])]));
    const corpo = el('tbody');
    const puoScrivere = haPermesso('observation.create');
    griglia.righe.forEach((riga) => {
      const tr = el('tr', {}, [el('td', { className: 'alunno', textContent: `${riga.cognome} ${riga.nome}` })]);
      riga.celle.forEach((cella) => {
        if (!puoScrivere) {
          const valoreTesto = cella.valore === null ? '—' : String(cella.valore);
          tr.append(el('td', { textContent: valoreTesto }));
          return;
        }
        const select = el('select', { className: 'cella' }, [
          el('option', { value: '', textContent: '—' }),
          ...griglia.scala.valori.map((v) => el('option', {
            value: v.valore, textContent: `${v.valore} · ${v.etichetta}`, selected: cella.valore === v.valore,
          })),
        ]);
        select.onchange = async () => {
          select.disabled = true;
          try {
            const valore = select.value === '' ? null : Number(select.value);
            await api(`/activities/${attivitaRif.activity_id}/enrollments/${riga.enrollmentId}/criteria/${cella.criterionId}`, {
              method: 'PUT', body: JSON.stringify({ valore }),
            });
            mostraGriglia(attivitaRif, teaching);
          } catch (errore) { mostraErrore(errore.message); select.disabled = false; }
        };
        tr.append(el('td', {}, [select]));
      });
      tr.append(el('td', { className: 'esito', textContent: `${riga.valutazionePresenti}/${riga.valutazioniTotali} · ${testoEsito(riga.esito)}` }));
      corpo.append(tr);
    });
    tabella.append(corpo);
    contenuto.append(el('div', { className: 'griglia-scroll' }, [tabella]));
  } catch (errore) { contenuto.textContent = ''; mostraErrore(errore.message); }
}

// --- Report classe (esistente) ----------------------------------------------

async function mostraReportClasse(attivitaRif, teaching) {
  mostraErrore(null);
  impostaPercorso(percorsoTeaching(teaching, [{ testo: attivitaRif.nome, onclick: () => mostraGriglia(attivitaRif, teaching) }, { testo: 'Report classe' }]));
  const contenuto = document.getElementById('contenuto');
  contenuto.textContent = 'Caricamento…';
  try {
    const report = await api(`/activities/${attivitaRif.activity_id}/report-classe`);
    contenuto.innerHTML = '';
    contenuto.append(el('div', { className: 'barra-sezioni' }, [
      el('button', { className: 'azione', textContent: '← Torna alla griglia', onclick: () => mostraGriglia(attivitaRif, teaching) }),
    ]));
    contenuto.append(el('h2', { textContent: `Report classe — ${attivitaRif.nome}` }));
    if (report.grigliaNonConfigurata) { contenuto.append(el('p', { textContent: 'Griglia non configurata.' })); return; }
    contenuto.append(el('p', { textContent: `${report.totaleAlunni} alunni · Risultato complessivo: ${testoEsito(report.complessivo)}` }));
    report.unitaPedagogiche.forEach((unita) => {
      const corpo = el('div', { className: 'corpo-nucleo' });
      const tabella = el('table', {}, [el('tr', {}, ['Criterio', 'Valutati', 'Non valutati', 'Distribuzione', 'Risultato', 'Giudizio'].map((t) => el('th', { textContent: t })))]);
      unita.criteri.forEach((c) => {
        const distribuzione = Object.entries(c.distribuzione).map(([v, n]) => `${v}:${n}`).join('  ');
        tabella.append(el('tr', {}, [
          el('td', { textContent: c.descrizione }),
          el('td', { textContent: String(c.valutati) }),
          el('td', { textContent: String(c.nonValutati) }),
          el('td', { textContent: distribuzione }),
          el('td', { textContent: c.esito.percentuale === null ? '—' : `${numeroIt(c.esito.percentuale)}%` }),
          el('td', { textContent: c.esito.giudizio || '—' }),
        ]));
      });
      corpo.append(tabella);
      contenuto.append(el('details', { className: 'nucleo', open: true }, [
        el('summary', {}, [document.createTextNode(unita.nome), el('span', { className: 'badge', textContent: testoEsito(unita.risultato) })]),
        corpo,
      ]));
    });
  } catch (errore) { contenuto.textContent = ''; mostraErrore(errore.message); }
}

  try {
    stato.me = await api('/auth/me');
    avviaApp();
  } catch (errore) {
    mostraLogin();
  }
})();
