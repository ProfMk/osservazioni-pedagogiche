<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Osservazioni pedagogiche — V1 multi-tenant</title>
<style>
  :root {
    --carta: #f6f4ee; --carta-scura: #ece8dc; --inchiostro: #232620; --inchiostro-tenue: #5b5d54;
    --riga: #d8d3c3; --accento: #2f4d3a; --ombra: 0 1px 2px rgba(35,38,32,.08);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--carta); color: var(--inchiostro); font: 15px/1.45 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  header.app { display: flex; align-items: center; gap: 1rem; padding: .85rem 1.25rem; background: var(--accento); color: #f3f1e8; position: sticky; top: 0; z-index: 20; flex-wrap: wrap; }
  header.app h1 { font-size: 1.05rem; font-weight: 600; margin: 0; letter-spacing: .01em; }
  header.app .filo { flex: 1; opacity: .9; font-size: .85rem; }
  header.app select, header.app button { font: inherit; padding: .3rem .5rem; border-radius: 5px; border: 1px solid transparent; }
  header.app button.link { background: none; border: none; color: #f3f1e8; text-decoration: underline; cursor: pointer; }
  nav.principale { display: flex; gap: .3rem; flex-wrap: wrap; padding: .5rem 1.25rem; background: var(--carta-scura); position: sticky; top: 52px; z-index: 19; border-bottom: 1px solid var(--riga); }
  nav.principale button { font: inherit; font-size: .85rem; padding: .4rem .8rem; border-radius: 6px; border: 1px solid transparent; background: none; color: var(--inchiostro); cursor: pointer; }
  nav.principale button:hover { background: #fff; }
  nav.principale button.attiva { background: var(--accento); color: #fff; }
  main { max-width: 1040px; margin: 0 auto; padding: 1.25rem; }
  .avviso { background: #fbf0d9; border: 1px solid #e3c583; color: #6b4d16; padding: .6rem .9rem; border-radius: 6px; font-size: .85rem; margin-bottom: 1rem; }
  .errore-box { background: #fbe2e0; border: 1px solid #d98b84; color: #7a241d; padding: .6rem .9rem; border-radius: 6px; font-size: .85rem; margin-bottom: 1rem; }
  nav.percorso { font-size: .85rem; color: var(--inchiostro-tenue); margin-bottom: 1rem; }
  nav.percorso button { background: none; border: none; color: var(--accento); cursor: pointer; font: inherit; padding: 0; text-decoration: underline; }
  .elenco { display: grid; gap: .5rem; }
  .scelta { text-align: left; background: #fff; border: 1px solid var(--riga); border-radius: 8px; padding: .75rem .9rem; cursor: pointer; font: inherit; color: inherit; box-shadow: var(--ombra); }
  .scelta:hover { border-color: var(--accento); }
  .scelta .tit { font-weight: 600; } .scelta .sub { color: var(--inchiostro-tenue); font-size: .85rem; }
  .form-carta { background: #fff; border: 1px solid var(--riga); border-radius: 8px; padding: 1.1rem 1.2rem; box-shadow: var(--ombra); max-width: 380px; margin: 3rem auto; }
  .form-carta h2 { margin-top: 0; }
  .form-carta label { display: block; font-size: .8rem; color: var(--inchiostro-tenue); margin: .6rem 0 .2rem; }
  .form-carta input, .form-carta select { width: 100%; padding: .5rem .6rem; border: 1px solid var(--riga); border-radius: 5px; font: inherit; }
  button.azione { background: var(--accento); color: #fff; border: none; border-radius: 6px; padding: .5rem 1rem; font: inherit; cursor: pointer; margin-top: .8rem; }
  button.azione:disabled { opacity: .6; cursor: default; }
  table.griglia { border-collapse: collapse; width: 100%; background: #fff; border-radius: 8px; box-shadow: var(--ombra); }
  .griglia-scroll { overflow-x: auto; border-radius: 8px; }
  table.griglia th, table.griglia td { border-bottom: 1px solid var(--riga); padding: .5rem .55rem; text-align: center; }
  table.griglia th { background: var(--carta-scura); font-weight: 600; font-size: .78rem; }
  table.griglia td.alunno, table.griglia th.alunno { text-align: left; position: sticky; left: 0; background: #fff; min-width: 9rem; }
  table.griglia th.alunno { background: var(--carta-scura); }
  select.cella { width: 4.2rem; padding: .25rem; }
  td.esito { font-size: .8rem; color: var(--inchiostro-tenue); white-space: nowrap; text-align: left; }
  .barra-sezioni { margin: 0 0 1rem; display: flex; gap: .5rem; flex-wrap: wrap; }
  details.nucleo { background: #fff; border: 1px solid var(--riga); border-radius: 8px; box-shadow: var(--ombra); margin-bottom: .6rem; }
  details.nucleo > summary { cursor: pointer; padding: .7rem .9rem; font-weight: 600; }
  details.nucleo .corpo-nucleo { padding: 0 .9rem .8rem; }
  .corpo-nucleo table { width: 100%; border-collapse: collapse; font-size: .85rem; margin-top: .3rem; }
  .corpo-nucleo th, .corpo-nucleo td { text-align: left; padding: .35rem .5rem; border-bottom: 1px dotted var(--riga); }
  .corpo-nucleo th { font-weight: 600; color: var(--inchiostro-tenue); font-size: .78rem; }
  .badge { display: inline-block; padding: .1rem .5rem; border-radius: 10px; background: var(--carta-scura); font-size: .75rem; margin-left: .4rem; }
  .form-attivita { background: #fff; border: 1px solid var(--riga); border-radius: 8px; padding: 1rem 1.1rem; margin-bottom: 1.25rem; box-shadow: var(--ombra); }
  .form-attivita .campi { display: grid; grid-template-columns: 2fr 1fr 1.6fr auto; gap: .6rem; align-items: end; }
  .form-attivita label { display: block; font-size: .78rem; color: var(--inchiostro-tenue); margin-bottom: .2rem; }
  .form-attivita input, .form-attivita select { width: 100%; padding: .4rem .5rem; border: 1px solid var(--riga); border-radius: 5px; font: inherit; }
  @media (max-width: 720px) { .form-attivita .campi { grid-template-columns: 1fr; } }
  .griglia-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: .8rem; margin-top: 1rem; }
  .card { background: #fff; border: 1px solid var(--riga); border-radius: 8px; padding: 1rem; box-shadow: var(--ombra); }
  .card h3 { margin: 0 0 .4rem; font-size: .95rem; }
  .card p { margin: 0 0 .6rem; color: var(--inchiostro-tenue); font-size: .85rem; }
  .sezione-titolo { font-size: 1.05rem; font-weight: 600; margin: 1.4rem 0 .6rem; }
  .sezione-titolo:first-child { margin-top: 0; }
  table.semplice { width: 100%; border-collapse: collapse; background: #fff; border-radius: 8px; box-shadow: var(--ombra); }
  table.semplice th, table.semplice td { text-align: left; padding: .5rem .6rem; border-bottom: 1px solid var(--riga); font-size: .88rem; }
  table.semplice th { background: var(--carta-scura); font-size: .78rem; }
</style>
</head>
<body>
<header class="app" id="intestazione" style="display:none">
  <h1>Osservazioni pedagogiche</h1>
  <span class="filo" id="filoUtente"></span>
  <select id="selectTenant"></select>
  <button class="link" id="bottoneLogout">Esci</button>
</header>
<nav class="principale" id="navPrincipale" style="display:none"></nav>
<main>
  <div id="erroreGlobale"></div>
  <nav class="percorso" id="percorso"></nav>
  <div id="contenuto">Caricamento…</div>
</main>

<script>
'use strict';

const stato = { me: null, sezioneAttiva: null };

function el(tag, props, figli) {
  const nodo = document.createElement(tag);
  Object.assign(nodo, props || {});
  (figli || []).forEach((f) => nodo.append(f));
  return nodo;
}

async function api(percorso, opzioni) {
  const risposta = await fetch('/api' + percorso, {
    ...opzioni,
    headers: {
      'Content-Type': 'application/json',
      ...(stato.me && stato.me.csrfToken ? { 'X-CSRF-Token': stato.me.csrfToken } : {}),
      ...(opzioni && opzioni.headers),
    },
  });
  if (!risposta.ok) {
    const corpo = await risposta.json().catch(() => ({}));
    const errore = new Error(corpo.errore || ('Errore HTTP ' + risposta.status));
    errore.status = risposta.status;
    throw errore;
  }
  return risposta.status === 204 ? null : risposta.json();
}

function mostraErrore(messaggio) {
  document.getElementById('erroreGlobale').innerHTML = '';
  if (messaggio) document.getElementById('erroreGlobale').append(el('div', { className: 'errore-box', textContent: messaggio }));
}

function numeroIt(v) { return v === null || v === undefined ? '—' : Number(v).toLocaleString('it-IT', { maximumFractionDigits: 2 }); }
function testoEsito(esito) { return esito.percentuale === null ? 'Non valutato' : `${numeroIt(esito.percentuale)}% · ${esito.giudizio || ''}`; }

/** true se l'account ha `codice` tra i permessi effettivi nel tenant attivo (sez. RBAC: mai un controllo "a occhio" lato UI sui dati, solo sulla VISIBILITÀ di scorciatoie — il backend rivaluta sempre). */
function haPermesso(codice) { return !!(stato.me && stato.me.permessiNelTenantAttivo && stato.me.permessiNelTenantAttivo.includes(codice)); }

/** I RoleAssignment con scope_type=SCHOOL_LEVEL dell'utente nel tenant attivo (un Coordinatore ne ha uno). */
function ruoliSchoolLevel() { return (stato.me.ruoliNelTenantAttivo || []).filter((r) => r.scope_type === 'SCHOOL_LEVEL'); }

// --- Schermata di login ------------------------------------------------

function mostraLogin() {
  document.getElementById('intestazione').style.display = 'none';
  document.getElementById('navPrincipale').style.display = 'none';
  document.getElementById('percorso').innerHTML = '';
  const email = el('input', { type: 'email', placeholder: 'nome@istituto.test', required: true });
  const password = el('input', { type: 'password', required: true });
  const erroreForm = el('div', { className: 'errore-box', style: 'display:none' });
  const bottone = el('button', { className: 'azione', type: 'submit', textContent: 'Accedi' });
  const form = el('form', {
    className: 'form-carta',
    onsubmit: async (evento) => {
      evento.preventDefault();
      erroreForm.style.display = 'none';
      bottone.disabled = true;
      try {
        const corpo = await api('/auth/login', { method: 'POST', body: JSON.stringify({ email: email.value, password: password.value }) });
        stato.me = corpo;
        avviaApp();
      } catch (errore) {
        erroreForm.textContent = errore.message;
        erroreForm.style.display = 'block';
        bottone.disabled = false;
      }
    },
  }, [
    el('h2', { textContent: 'Accedi' }),
    el('label', { textContent: 'Email' }), email,
    el('label', { textContent: 'Password' }), password,
    erroreForm, bottone,
  ]);
  document.getElementById('contenuto').innerHTML = '';
  document.getElementById('contenuto').append(form);
}

// --- Intestazione con tenant attivo/switch, navigazione principale ---------

function aggiornaIntestazione() {
  const header = document.getElementById('intestazione');
  header.style.display = 'flex';
  document.getElementById('filoUtente').textContent =
    `${stato.me.account.nome} ${stato.me.account.cognome}${stato.me.isPlatformAdmin ? ' · PLATFORM_ADMIN' : ''}`;
  const select = document.getElementById('selectTenant');
  select.innerHTML = '';
  select.append(el('option', { value: '', textContent: 'Nessun tenant attivo' }));
  stato.me.tenantsDisponibiliPerSwitch.forEach((t) => {
    const id = t.tenant_id ?? t.id;
    select.append(el('option', { value: id, textContent: t.nome, selected: id === stato.me.activeTenantId }));
  });
  select.onchange = async () => {
    if (!select.value) return;
    try {
      // Il cambio tenant ricarica sempre /auth/me (nuovi permessi/ruoli) e riparte dalla Dashboard:
      // nessuno stato del tenant precedente (teaching/classe/attività aperti) sopravvive allo switch.
      stato.me = await api('/auth/switch-tenant', { method: 'POST', body: JSON.stringify({ tenantId: Number(select.value) }) });
      avviaApp();
    } catch (errore) { mostraErrore(errore.message); }
  };
}

const VOCI_NAV = [
  { id: 'dashboard', etichetta: 'Dashboard', azione: () => mostraDashboard() },
  { id: 'teachings', etichetta: 'I miei Teaching', azione: () => mostraTeachings() },
  { id: 'classi', etichetta: 'Classi', azione: () => avviaClassi() },
  { id: 'studenti', etichetta: 'Studenti', azione: () => avviaStudenti() },
  { id: 'osservazioni', etichetta: 'Osservazioni', azione: () => avviaOsservazioni() },
  { id: 'valutazioni', etichetta: 'Valutazioni', azione: () => avviaValutazioni() },
];

function aggiornaNavPrincipale() {
  const nav = document.getElementById('navPrincipale');
  if (!stato.me.activeTenantId) { nav.style.display = 'none'; return; }
  nav.style.display = 'flex';
  nav.innerHTML = '';
  VOCI_NAV.forEach((voce) => {
    nav.append(el('button', {
      textContent: voce.etichetta,
      className: stato.sezioneAttiva === voce.id ? 'attiva' : '',
      onclick: () => { stato.sezioneAttiva = voce.id; aggiornaNavPrincipale(); voce.azione(); },
    }));
  });
  // Amministrazione: SOLO se il ruolo lo consente (PLATFORM_ADMIN in questa V1).
  if (stato.me.isPlatformAdmin) {
    nav.append(el('button', {
      textContent: 'Amministrazione',
      className: stato.sezioneAttiva === 'admin' ? 'attiva' : '',
      onclick: () => { stato.sezioneAttiva = 'admin'; aggiornaNavPrincipale(); mostraPannelloPlatform(); },
    }));
  }
}

document.getElementById('bottoneLogout').addEventListener('click', async () => {
  await api('/auth/logout', { method: 'POST' }).catch(() => {});
  stato.me = null;
  mostraLogin();
});

async function avviaApp() {
  aggiornaIntestazione();
  aggiornaNavPrincipale();
  if (stato.me.activeTenantId) { stato.sezioneAttiva = 'dashboard'; aggiornaNavPrincipale(); mostraDashboard(); }
  else mostraSceltaTenant();
}

function mostraSceltaTenant() {
  impostaPercorso([{ testo: 'Osservazioni pedagogiche' }]);
  document.getElementById('contenuto').innerHTML = '';
  document.getElementById('contenuto').append(
    el('p', { textContent: 'Seleziona un tenant attivo dal menu in alto per iniziare.' })
  );
  if (stato.me.isPlatformAdmin) mostraPannelloPlatform();
}

async function mostraPannelloPlatform() {
  impostaPercorso([{ testo: 'Amministrazione' }]);
  const contenuto = document.getElementById('contenuto');
  contenuto.textContent = 'Caricamento…';
  try {
    const tenants = await api('/platform/tenants');
    contenuto.innerHTML = '';
    const box = el('div', { className: 'form-attivita' }, [el('h2', { textContent: 'Tenant della piattaforma' })]);
    const lista = el('div', { className: 'elenco' });
    tenants.forEach((t) => lista.append(el('div', { className: 'scelta' }, [
      el('div', { className: 'tit', textContent: t.nome }), el('div', { className: 'sub', textContent: `${t.slug} · ${t.stato}` }),
    ])));
    box.append(lista);
    contenuto.append(box);
  } catch (errore) { contenuto.textContent = ''; mostraErrore(errore.message); }
}

// --- Percorso di navigazione (breadcrumb generico) --------------------------

function impostaPercorso(voci) {
  const box = document.getElementById('percorso');
  box.innerHTML = '';
  voci.forEach((voce, i) => {
    if (i > 0) box.append(document.createTextNode(' › '));
    box.append(voce.onclick ? el('button', { textContent: voce.testo, onclick: voce.onclick }) : el('span', { textContent: voce.testo }));
  });
}
const CROCE_DASHBOARD = { testo: 'Dashboard', onclick: () => mostraDashboard() };

// --- Dashboard (coerente col ruolo) -----------------------------------------

async function mostraDashboard() {
  mostraErrore(null);
  impostaPercorso([{ testo: 'Dashboard' }]);
  const contenuto = document.getElementById('contenuto');
  contenuto.textContent = 'Caricamento…';
  try {
    const teachings = await api('/teachings');
    contenuto.innerHTML = '';
    const ruoli = stato.me.ruoliNelTenantAttivo || [];
    const nomiRuoli = [...new Set(ruoli.map((r) => r.ruolo))];
    contenuto.append(el('h2', { textContent: `Benvenuto/a, ${stato.me.account.nome}` }));
    contenuto.append(el('p', {
      className: 'sub',
      style: 'color:var(--inchiostro-tenue);margin-top:-.5rem',
      textContent: nomiRuoli.length ? `Ruolo/i in questo tenant: ${nomiRuoli.join(', ')}` : 'Nessun ruolo assegnato in questo tenant.',
    }));

    const cards = el('div', { className: 'griglia-cards' });
    cards.append(el('div', { className: 'card' }, [
      el('h3', { textContent: 'I miei Teaching' }),
      el('p', { textContent: teachings.length ? `${teachings.length} Teaching assegnati.` : 'Nessun Teaching assegnato in questo tenant.' }),
      el('button', { className: 'azione', textContent: 'Apri', onclick: () => { stato.sezioneAttiva = 'teachings'; aggiornaNavPrincipale(); mostraTeachings(); } }),
    ]));

    const scopeLivello = ruoliSchoolLevel()[0];
    if (scopeLivello || haPermesso('class.read')) {
      cards.append(el('div', { className: 'card' }, [
        el('h3', { textContent: 'Classi' }),
        el('p', { textContent: scopeLivello ? 'Le classi del tuo livello scolastico.' : 'Sfoglia le classi del tenant.' }),
        el('button', { className: 'azione', textContent: 'Apri', onclick: () => { stato.sezioneAttiva = 'classi'; aggiornaNavPrincipale(); avviaClassi(); } }),
      ]));
    }
    cards.append(el('div', { className: 'card' }, [
      el('h3', { textContent: 'Osservazioni' }),
      el('p', { textContent: 'Griglia e report delle attività.' }),
      el('button', { className: 'azione', textContent: 'Apri', onclick: () => { stato.sezioneAttiva = 'osservazioni'; aggiornaNavPrincipale(); avviaOsservazioni(); } }),
    ]));
    cards.append(el('div', { className: 'card' }, [
      el('h3', { textContent: 'Valutazioni' }),
      el('p', { textContent: 'Assessment registrati sui tuoi Teaching.' }),
      el('button', { className: 'azione', textContent: 'Apri', onclick: () => { stato.sezioneAttiva = 'valutazioni'; aggiornaNavPrincipale(); avviaValutazioni(); } }),
    ]));
    contenuto.append(cards);
  } catch (errore) { contenuto.textContent = ''; mostraErrore(errore.message); }
}

// --- I miei Teaching (esistente) --------------------------------------------

async function mostraTeachings() {
  mostraErrore(null);
  impostaPercorso([CROCE_DASHBOARD, { testo: 'I miei Teaching' }]);
  const contenuto = document.getElementById('contenuto');
  contenuto.textContent = 'Caricamento…';
  try {
    const teachings = await api('/teachings');
    contenuto.innerHTML = '';
    contenuto.append(el('h2', { textContent: 'I miei Teaching' }));
    if (teachings.length === 0) {
      contenuto.append(el('p', { textContent: 'Nessun Teaching assegnato in questo tenant.' }));
      return;
    }
    const lista = el('div', { className: 'elenco' });
    teachings.forEach((t) => lista.append(el('button', {
      className: 'scelta', onclick: () => mostraActivities(t),
    }, [
      el('div', { className: 'tit', textContent: `${t.materia} — ${t.classe}` }),
      el('div', { className: 'sub', textContent: `Anno scolastico ${t.anno_scolastico}` }),
    ])));
    contenuto.append(lista);
  } catch (errore) { contenuto.textContent = ''; mostraErrore(errore.message); }
}

// --- Risoluzione dell'ingresso in base al ruolo (Classi/Studenti/Osservazioni/Valutazioni) --

/**
 * Decide da dove far partire la navigazione di Classi/Studenti/Osservazioni/Valutazioni:
 * - un Coordinatore (scope SCHOOL_LEVEL) parte direttamente dal proprio livello;
 * - chi ha class.read più ampio (Tenant Admin/Platform Admin) sceglie prima il livello;
 * - un Docente (nessun class.read) parte dai propri Teaching.
 * Questa è SOLO una scorciatoia di navigazione: l'autorizzazione reale è sempre
 * rivalutata dal backend a ogni chiamata (sez. 7 del task).
 */
function risolviIngresso() {
  const livello = ruoliSchoolLevel()[0];
  if (livello) return { tipo: 'LIVELLO', schoolLevelId: livello.scope_school_level_id };
  if (haPermesso('class.read')) return { tipo: 'SCEGLI_LIVELLO' };
  return { tipo: 'DOCENTE' };
}

async function avviaClassi() {
  const ingresso = risolviIngresso();
  if (ingresso.tipo === 'LIVELLO') return mostraClassiDelLivello(ingresso.schoolLevelId);
  if (ingresso.tipo === 'SCEGLI_LIVELLO') return mostraSceltaLivello((liv) => mostraClassiDelLivello(liv.id));
  return mostraClassiDaTeaching();
}

async function avviaStudenti() {
  const ingresso = risolviIngresso();
  if (ingresso.tipo === 'LIVELLO') return mostraClassiDelLivello(ingresso.schoolLevelId, 'studenti');
  if (ingresso.tipo === 'SCEGLI_LIVELLO') return mostraSceltaLivello((liv) => mostraClassiDelLivello(liv.id, 'studenti'));
  return mostraSceltaTeachingPer('Studenti', (t) => mostraStudentiDiTeaching(t));
}

async function avviaOsservazioni() {
  const ingresso = risolviIngresso();
  if (ingresso.tipo === 'LIVELLO') return mostraClassiDelLivello(ingresso.schoolLevelId, 'osservazioni');
  if (ingresso.tipo === 'SCEGLI_LIVELLO') return mostraSceltaLivello((liv) => mostraClassiDelLivello(liv.id, 'osservazioni'));
  return mostraSceltaTeachingPer('Osservazioni', (t) => mostraActivities(t));
}

async function avviaValutazioni() {
  const ingresso = risolviIngresso();
  if (ingresso.tipo === 'LIVELLO') return mostraClassiDelLivello(ingresso.schoolLevelId, 'valutazioni');
  if (ingresso.tipo === 'SCEGLI_LIVELLO') return mostraSceltaLivello((liv) => mostraClassiDelLivello(liv.id, 'valutazioni'));
  return mostraSceltaTeachingPer('Valutazioni', (t) => mostraValutazioniDiTeaching(t));
}

/** Sceglie tra i propri Teaching (Docente) quando ce n'è più di uno; se uno solo, prosegue direttamente. */
async function mostraSceltaTeachingPer(etichetta, prosegui) {
  mostraErrore(null);
  impostaPercorso([CROCE_DASHBOARD, { testo: etichetta }]);
  const contenuto = document.getElementById('contenuto');
  contenuto.textContent = 'Caricamento…';
  try {
    const teachings = await api('/teachings');
    if (teachings.length === 0) {
      contenuto.innerHTML = '';
      contenuto.append(el('p', { textContent: 'Nessun Teaching assegnato: nessun dato da mostrare qui.' }));
      return;
    }
    if (teachings.length === 1) return prosegui(teachings[0]);
    contenuto.innerHTML = '';
    contenuto.append(el('h2', { textContent: `${etichetta} — scegli un Teaching` }));
    const lista = el('div', { className: 'elenco' });

// --- Attività di un Teaching (esistente) ------------------------------------

function costruisciFormNuovaActivity(teaching, unita) {
  const inputNome = el('input', { type: 'text', placeholder: 'Es. Numeri entro il cento', required: true });
  const inputData = el('input', { type: 'date', required: true });
  const selectUnita = el('select', { required: true }, [
    el('option', { value: '', textContent: unita.length ? "Scegli l'unità pedagogica…" : 'Nessuna unità configurata per questa materia' }),
    ...unita.map((u) => el('option', { value: u.id, textContent: u.nome })),
  ]);
  const erroreForm = el('div', { className: 'errore-form' });
  const bottone = el('button', { className: 'azione', type: 'submit', textContent: 'Crea attività' });
  return el('form', {
    className: 'form-attivita',
    onsubmit: async (evento) => {
      evento.preventDefault();
      erroreForm.textContent = '';
      if (!selectUnita.value) { erroreForm.textContent = "Scegliere un'unità pedagogica."; return; }
      bottone.disabled = true;
      try {
        await api(`/teachings/${teaching.teaching_id}/activities`, {
          method: 'POST',
          body: JSON.stringify({ nome: inputNome.value, dataAttivita: inputData.value, pedagogicalUnitId: Number(selectUnita.value) }),
        });
        mostraActivities(teaching);
      } catch (errore) { erroreForm.textContent = errore.message; bottone.disabled = false; }
    },
  }, [
    el('h2', { textContent: 'Nuova attività' }),
    el('div', { className: 'campi' }, [
      el('div', {}, [el('label', { textContent: 'Titolo' }), inputNome]),
      el('div', {}, [el('label', { textContent: 'Data' }), inputData]),
      el('div', {}, [el('label', { textContent: 'Unità pedagogica' }), selectUnita]),
      bottone,
    ]),
    erroreForm,
  ]);
}

async function mostraActivities(teaching) {
  mostraErrore(null);
  impostaPercorso([CROCE_DASHBOARD, { testo: 'Osservazioni' }, { testo: `${teaching.materia} — ${teaching.classe}` }]);
  const contenuto = document.getElementById('contenuto');
  contenuto.textContent = 'Caricamento…';
  try {
    const [attivita, unita] = await Promise.all([
      api(`/teachings/${teaching.teaching_id}/activities`),
      api(`/teachings/${teaching.teaching_id}/pedagogical-units`).catch(() => []),
    ]);
    contenuto.innerHTML = '';
    contenuto.append(el('h2', { textContent: `${teaching.materia} — ${teaching.classe}` }));
    if (haPermesso('activity.create')) contenuto.append(costruisciFormNuovaActivity(teaching, unita));
    if (attivita.length === 0) {
      contenuto.append(el('p', { textContent: haPermesso('activity.create') ? 'Nessuna attività: creane una qui sopra.' : 'Nessuna attività per questo Teaching.' }));
      return;
    }
    const lista = el('div', { className: 'elenco' });
    attivita.forEach((a) => lista.append(el('button', {
      className: 'scelta', onclick: () => mostraGriglia(a, teaching),
    }, [
      el('div', { className: 'tit', textContent: a.nome }),
      el('div', { className: 'sub', textContent: `${a.unita_pedagogica} · ${new Date(a.data_attivita).toLocaleDateString('it-IT')}` }),
    ])));
    contenuto.append(lista);
  } catch (errore) { contenuto.textContent = ''; mostraErrore(errore.message); }
}

// --- Griglia di un'attività (esistente) --------------------------------------

async function mostraGriglia(attivitaRif, teaching) {
  mostraErrore(null);
  impostaPercorso([CROCE_DASHBOARD, { testo: 'Osservazioni' }, { testo: `${teaching.materia} — ${teaching.classe}`, onclick: () => mostraActivities(teaching) }, { testo: attivitaRif.nome }]);
  const contenuto = document.getElementById('contenuto');
  contenuto.textContent = 'Caricamento…';
  try {
    const griglia = await api(`/activities/${attivitaRif.activity_id}/griglia`);
    contenuto.innerHTML = '';
    if (griglia.grigliaNonConfigurata) {
      contenuto.append(el('p', { textContent: "L'unità pedagogica non ha criteri configurati." }));
      return;
    }
    contenuto.append(el('div', { className: 'barra-sezioni' }, [
      el('button', { className: 'azione', textContent: 'Report classe', onclick: () => mostraReportClasse(attivitaRif, teaching) }),
    ]));
    const tabella = el('table', { className: 'griglia' });
    tabella.append(el('thead', {}, [el('tr', {}, [
      el('th', { className: 'alunno', textContent: 'Alunno' }),
      ...griglia.criteri.map((c) => el('th', { textContent: c.descrizione })),
      el('th', { textContent: 'Esito' }),
    ])]));
    const corpo = el('tbody');
    const puoScrivere = haPermesso('observation.create');
    griglia.righe.forEach((riga) => {
      const tr = el('tr', {}, [el('td', { className: 'alunno', textContent: `${riga.cognome} ${riga.nome}` })]);
      riga.celle.forEach((cella) => {
        if (!puoScrivere) {
          const valoreTesto = cella.valore === null ? '—' : String(cella.valore);
          tr.append(el('td', { textContent: valoreTesto }));
          return;
        }
        const select = el('select', { className: 'cella' }, [
          el('option', { value: '', textContent: '—' }),
          ...griglia.scala.valori.map((v) => el('option', {
            value: v.valore, textContent: `${v.valore} · ${v.etichetta}`, selected: cella.valore === v.valore,
          })),
        ]);
        select.onchange = async () => {
          select.disabled = true;
          try {
            const valore = select.value === '' ? null : Number(select.value);
            await api(`/activities/${attivitaRif.activity_id}/enrollments/${riga.enrollmentId}/criteria/${cella.criterionId}`, {
              method: 'PUT', body: JSON.stringify({ valore }),
            });
            mostraGriglia(attivitaRif, teaching);
          } catch (errore) { mostraErrore(errore.message); select.disabled = false; }
        };
        tr.append(el('td', {}, [select]));
      });
      tr.append(el('td', { className: 'esito', textContent: `${riga.valutazionePresenti}/${riga.valutazioniTotali} · ${testoEsito(riga.esito)}` }));
      corpo.append(tr);
    });
    tabella.append(corpo);
    contenuto.append(el('div', { className: 'griglia-scroll' }, [tabella]));
  } catch (errore) { contenuto.textContent = ''; mostraErrore(errore.message); }
}

// --- Report classe (esistente) ----------------------------------------------

async function mostraReportClasse(attivitaRif, teaching) {
  mostraErrore(null);
  const contenuto = document.getElementById('contenuto');
  contenuto.textContent = 'Caricamento…';
  try {
    const report = await api(`/activities/${attivitaRif.activity_id}/report-classe`);
    contenuto.innerHTML = '';
    contenuto.append(el('div', { className: 'barra-sezioni' }, [
      el('button', { className: 'azione', textContent: '← Torna alla griglia', onclick: () => mostraGriglia(attivitaRif, teaching) }),
    ]));
    contenuto.append(el('h2', { textContent: `Report classe — ${attivitaRif.nome}` }));
    if (report.grigliaNonConfigurata) { contenuto.append(el('p', { textContent: 'Griglia non configurata.' })); return; }
    contenuto.append(el('p', { textContent: `${report.totaleAlunni} alunni · Risultato complessivo: ${testoEsito(report.complessivo)}` }));
    report.unitaPedagogiche.forEach((unita) => {
      const corpo = el('div', { className: 'corpo-nucleo' });
      const tabella = el('table', {}, [el('tr', {}, ['Criterio', 'Valutati', 'Non valutati', 'Distribuzione', 'Risultato', 'Giudizio'].map((t) => el('th', { textContent: t })))]);
      unita.criteri.forEach((c) => {
        const distribuzione = Object.entries(c.distribuzione).map(([v, n]) => `${v}:${n}`).join('  ');
        tabella.append(el('tr', {}, [
          el('td', { textContent: c.descrizione }),
          el('td', { textContent: String(c.valutati) }),
          el('td', { textContent: String(c.nonValutati) }),
          el('td', { textContent: distribuzione }),
          el('td', { textContent: c.esito.percentuale === null ? '—' : `${numeroIt(c.esito.percentuale)}%` }),
          el('td', { textContent: c.esito.giudizio || '—' }),
        ]));
      });
      corpo.append(tabella);
      contenuto.append(el('details', { className: 'nucleo', open: true }, [
        el('summary', {}, [document.createTextNode(unita.nome), el('span', { className: 'badge', textContent: testoEsito(unita.risultato) })]),
        corpo,
      ]));
    });
  } catch (errore) { contenuto.textContent = ''; mostraErrore(errore.message); }
}
