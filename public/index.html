<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Osservazioni pedagogiche</title>
<style>
  :root {
    --carta: #f6f4ee;
    --carta-scura: #ece8dc;
    --inchiostro: #232620;
    --inchiostro-tenue: #5b5d54;
    --riga: #d8d3c3;
    --accento: #2f4d3a;      /* verde muschio: identità della materia/azione primaria */
    --autonomo: #2f7d3c;      /* verde: Autonomo (2) */
    --supporto: #b8960b;      /* giallo (dorato, leggibile): Con supporto (1) */
    --non-manifestato: #b3261e; /* rosso: Non manifestato (0) */
    --non-valutato: #78766e;  /* grigio: Non valutato (—) */
    --ombra: 0 1px 2px rgba(35,38,32,.08);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--carta);
    color: var(--inchiostro);
    font: 15px/1.45 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  header.app {
    display: flex; align-items: center; gap: 1rem;
    padding: .85rem 1.25rem;
    background: var(--accento); color: #f3f1e8;
    position: sticky; top: 0; z-index: 20;
  }
  header.app h1 { font-size: 1.05rem; font-weight: 600; margin: 0; letter-spacing: .01em; }
  header.app .filo { flex: 1; opacity: .85; font-size: .85rem; }
  header.app input {
    width: 5rem; padding: .3rem .5rem; border-radius: 5px; border: 1px solid transparent;
    font: inherit;
  }
  header.app label { font-size: .8rem; opacity: .9; }
  main { max-width: 980px; margin: 0 auto; padding: 1.25rem; }

  .avviso {
    background: #fbf0d9; border: 1px solid #e3c583; color: #6b4d16;
    padding: .6rem .9rem; border-radius: 6px; font-size: .85rem; margin-bottom: 1rem;
  }

  nav.percorso { font-size: .85rem; color: var(--inchiostro-tenue); margin-bottom: 1rem; }
  nav.percorso button {
    background: none; border: none; color: var(--accento); cursor: pointer;
    font: inherit; padding: 0; text-decoration: underline;
  }

  .elenco { display: grid; gap: .5rem; }
  .scelta {
    text-align: left; background: #fff; border: 1px solid var(--riga); border-radius: 8px;
    padding: .75rem .9rem; cursor: pointer; font: inherit; color: inherit; box-shadow: var(--ombra);
  }
  .scelta:hover { border-color: var(--accento); }
  .scelta .tit { font-weight: 600; }
  .scelta .sub { color: var(--inchiostro-tenue); font-size: .85rem; }

  table.griglia { border-collapse: collapse; width: 100%; background: #fff; border-radius: 8px; box-shadow: var(--ombra); }
  .griglia-scroll { overflow-x: auto; border-radius: 8px; }
  table.griglia th, table.griglia td { border-bottom: 1px solid var(--riga); padding: .5rem .55rem; text-align: center; }
  table.griglia th { background: var(--carta-scura); font-weight: 600; font-size: .78rem; vertical-align: bottom; }
  table.griglia th.criterio { min-width: 6.5rem; max-width: 9rem; white-space: normal; line-height: 1.25; }
  table.griglia th.alunno, table.griglia td.alunno { text-align: left; position: sticky; left: 0; background: #fff; min-width: 9rem; }
  table.griglia th.alunno { background: var(--carta-scura); }
  table.griglia td.alunno button {
    background: none; border: none; font: inherit; color: var(--inchiostro); cursor: pointer;
    text-decoration: underline; text-align: left; padding: 0;
  }
  td.esito { font-size: .8rem; color: var(--inchiostro-tenue); white-space: nowrap; min-width: 9rem; text-align: left; }

  .cella {
    width: 2.4rem; height: 2.1rem; border-radius: 6px; border: 1px solid var(--riga);
    background: #fff; cursor: pointer; font-weight: 700; font-variant-numeric: tabular-nums;
    color: var(--inchiostro-tenue);
  }
  .cella[data-p="0"] { background: color-mix(in srgb, var(--non-manifestato) 18%, white); border-color: var(--non-manifestato); color: var(--non-manifestato); }
  .cella[data-p="1"] { background: color-mix(in srgb, var(--supporto) 18%, white); border-color: var(--supporto); color: var(--supporto); }
  .cella[data-p="2"] { background: color-mix(in srgb, var(--autonomo) 18%, white); border-color: var(--autonomo); color: var(--autonomo); }
  .cella[data-p=""] { border-style: dashed; color: var(--non-valutato); }

  .menu-valutazione {
    position: fixed; z-index: 50; background: #fff; border-radius: 8px;
    box-shadow: 0 6px 20px rgba(35,38,32,.25); padding: .35rem; min-width: 11rem;
    display: flex; flex-direction: column; gap: .25rem;
  }
  .menu-valutazione button {
    display: flex; align-items: center; gap: .55rem; border: none; border-radius: 6px;
    padding: .5rem .6rem; font: inherit; font-size: .88rem; cursor: pointer; text-align: left;
    background: #fff; color: var(--inchiostro);
  }
  .menu-valutazione button:hover, .menu-valutazione button:focus-visible { background: var(--carta-scura); }
  .menu-valutazione .pallino-opzione { width: .95rem; height: .95rem; border-radius: 50%; flex: none; }
  .menu-valutazione button[data-p="2"] .pallino-opzione { background: var(--autonomo); }
  .menu-valutazione button[data-p="1"] .pallino-opzione { background: var(--supporto); }
  .menu-valutazione button[data-p="0"] .pallino-opzione { background: var(--non-manifestato); }
  .menu-valutazione button[data-p=""] .pallino-opzione { background: var(--non-valutato); }
  .menu-valutazione button.selezionata { font-weight: 600; }
  .menu-valutazione button.selezionata::after { content: '✓'; margin-left: auto; color: var(--accento); }

  .legenda { display: flex; gap: 1rem; font-size: .8rem; color: var(--inchiostro-tenue); margin: .75rem 0 1rem; flex-wrap: wrap; }
  .legenda span.pallino { display: inline-block; width: .6rem; height: .6rem; border-radius: 50%; margin-right: .35rem; }

  dialog.scheda { border: none; border-radius: 10px; padding: 0; width: min(560px, 92vw); box-shadow: 0 10px 30px rgba(0,0,0,.2); }
  dialog.scheda::backdrop { background: rgba(35,38,32,.35); }
  .scheda-corpo { padding: 1.25rem 1.4rem; }
  .scheda-corpo h2 { margin: 0 0 .1rem; font-size: 1.15rem; }
  .scheda-corpo .meta { color: var(--inchiostro-tenue); font-size: .85rem; margin-bottom: 1rem; }
  .scheda-corpo table { width: 100%; border-collapse: collapse; margin-bottom: .9rem; }
  .scheda-corpo td, .scheda-corpo th { padding: .35rem 0; border-bottom: 1px solid var(--riga); text-align: left; font-size: .9rem; }
  .scheda-corpo textarea { width: 100%; min-height: 4.5rem; font: inherit; padding: .5rem; border: 1px solid var(--riga); border-radius: 6px; }
  .barra { height: .45rem; border-radius: 3px; background: var(--carta-scura); overflow: hidden; margin-top: .25rem; }
  .barra > i { display: block; height: 100%; background: var(--accento); }
  .storico-riga { display: flex; align-items: center; gap: .6rem; font-size: .85rem; margin-bottom: .35rem; }
  .storico-riga .nome { flex: 0 0 11rem; }
  .storico-riga .barra { flex: 1; }
  .storico-riga .val { flex: 0 0 3.4rem; text-align: right; color: var(--inchiostro-tenue); }
  .chiudi { margin-top: .5rem; }
  button.azione { background: var(--accento); color: #fff; border: none; border-radius: 6px; padding: .45rem .9rem; font: inherit; cursor: pointer; }
  button.azione:disabled { opacity: .6; cursor: default; }

  .form-attivita {
    background: #fff; border: 1px solid var(--riga); border-radius: 8px; padding: 1rem 1.1rem;
    margin-bottom: 1.25rem; box-shadow: var(--ombra);
  }
  .form-attivita h2 { font-size: .95rem; margin: 0 0 .75rem; }
  .form-attivita .campi { display: grid; grid-template-columns: 2fr 1fr 1.6fr auto; gap: .6rem; align-items: end; }
  .form-attivita label { display: block; font-size: .78rem; color: var(--inchiostro-tenue); margin-bottom: .2rem; }
  .form-attivita input, .form-attivita select {
    width: 100%; padding: .4rem .5rem; border: 1px solid var(--riga); border-radius: 5px; font: inherit;
  }
  .errore-form { color: var(--non-manifestato); font-size: .8rem; margin-top: .5rem; }

  .barra-sezioni { margin: 0 0 1rem; }
  .riepilogo-studente { color: var(--inchiostro-tenue); font-size: .9rem; margin: 0 0 1rem; }
  .scelta .nuclei-sintesi { display: flex; flex-wrap: wrap; gap: .3rem .9rem; margin-top: .3rem; font-size: .8rem; color: var(--inchiostro-tenue); }
  details.nucleo {
    background: #fff; border: 1px solid var(--riga); border-radius: 8px; box-shadow: var(--ombra);
    margin-bottom: .6rem;
  }
  details.nucleo > summary { cursor: pointer; padding: .7rem .9rem; font-weight: 600; }
  details.nucleo > summary .sub { font-weight: 400; color: var(--inchiostro-tenue); font-size: .85rem; margin-left: .4rem; }
  details.nucleo .corpo-nucleo { padding: 0 .9rem .8rem; }
  .criterio { border-top: 1px solid var(--riga); padding: .6rem 0; }
  .criterio .intestazione { display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
  .criterio .intestazione .cumulativo { color: var(--inchiostro-tenue); font-size: .85rem; }
  .criterio table { width: 100%; border-collapse: collapse; margin-top: .35rem; font-size: .85rem; }
  .criterio th, .criterio td { text-align: left; padding: .25rem .4rem .25rem 0; border-bottom: 1px dotted var(--riga); }
  .criterio th { font-weight: 600; color: var(--inchiostro-tenue); font-size: .78rem; }
  .livello { display: inline-block; padding: .05rem .45rem; border-radius: 5px; border: 1px solid var(--riga); font-size: .8rem; }
  .livello[data-p="0"] { color: var(--non-manifestato); border-color: var(--non-manifestato); background: color-mix(in srgb, var(--non-manifestato) 12%, white); }
  .livello[data-p="1"] { color: var(--supporto); border-color: var(--supporto); background: color-mix(in srgb, var(--supporto) 12%, white); }
  .livello[data-p="2"] { color: var(--autonomo); border-color: var(--autonomo); background: color-mix(in srgb, var(--autonomo) 12%, white); }
  .livello[data-p=""] { color: var(--non-valutato); border-style: dashed; }
  .spiegazione { font-size: .8rem; color: var(--inchiostro-tenue); margin: 0 0 1rem; }
  .secondario { font-size: .78rem; color: var(--inchiostro-tenue); margin: .2rem 0 0; }
  .criterio tr.in-corrente td { background: color-mix(in srgb, var(--accento) 9%, white); font-weight: 600; }
  .criterio tr.in-corrente td:last-child { color: var(--accento); }
  .corpo-nucleo > table { width: 100%; border-collapse: collapse; margin-top: .3rem; font-size: .85rem; }
  .corpo-nucleo > table th, .corpo-nucleo > table td { text-align: left; padding: .35rem .5rem; border-bottom: 1px dotted var(--riga); }
  .corpo-nucleo > table th { font-weight: 600; color: var(--inchiostro-tenue); font-size: .78rem; }
  @media (max-width: 720px) {
    .form-attivita .campi { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<header class="app">
  <h1>Osservazioni pedagogiche</h1>
  <span class="filo" id="filoPercorso"></span>
  <label>Docente (ID) <input id="docenteId" type="number" min="1" value="1" /></label>
</header>
<main>
  <p class="avviso">
    Modalità di sviluppo: l'identità del docente è impostata a mano nel campo qui sopra
    (header <code>X-Docente-Id</code>). Non è un login: va sostituita da un'autenticazione
    reale prima di qualunque uso con dati veri (vedi <code>server/auth.js</code>).
  </p>
  <nav class="percorso" id="percorso"></nav>
  <div id="contenuto">Caricamento…</div>
</main>

<dialog class="scheda" id="dialogoScheda">
  <div class="scheda-corpo" id="corpoScheda"></div>
</dialog>

<script>
'use strict';

const stato = {
  insegnamenti: [], materiaCorrente: null, insegnamentoCorrente: null, attivitaCorrente: null,
  studentiAperti: false, studenteCorrente: null, reportClasseAperto: false,
};

function docenteId() { return document.getElementById('docenteId').value; }

async function api(percorso, opzioni) {
  const risposta = await fetch('/api' + percorso, {
    ...opzioni,
    headers: { 'Content-Type': 'application/json', 'X-Docente-Id': docenteId(), ...(opzioni && opzioni.headers) },
  });
  if (!risposta.ok) {
    const corpo = await risposta.json().catch(() => ({}));
    throw new Error(corpo.errore || ('Errore HTTP ' + risposta.status));
  }
  return risposta.status === 204 ? null : risposta.json();
}

function el(tag, props, figli) {
  const nodo = document.createElement(tag);
  Object.assign(nodo, props || {});
  (figli || []).forEach((f) => nodo.append(f));
  return nodo;
}

function aggiornaPercorso() {
  const box = document.getElementById('percorso');
  box.innerHTML = '';
  const home = el('button', { textContent: 'I miei insegnamenti', onclick: mostraInsegnamenti });
  box.append(home);
  if (stato.materiaCorrente) {
    box.append(document.createTextNode(' › '));
    const materia = stato.materiaCorrente;
    box.append(el('button', { textContent: materia, onclick: () => mostraClassi(materia) }));
  }
  if (stato.insegnamentoCorrente) {
    box.append(document.createTextNode(' › '));
    const ins = stato.insegnamentoCorrente;
    box.append(el('button', {
      textContent: `${ins.classe} (${ins.anno_scolastico})`,
      onclick: () => mostraAttivita(ins),
    }));
  }
  if (stato.attivitaCorrente) {
    box.append(document.createTextNode(' › '));
    if (stato.reportClasseAperto) {
      const attivitaRif = stato.attivitaCorrente;
      box.append(el('button', { textContent: attivitaRif.nome, onclick: () => mostraGriglia(attivitaRif) }));
    } else {
      box.append(el('span', { textContent: stato.attivitaCorrente.nome }));
    }
  }
  if (stato.reportClasseAperto) {
    box.append(document.createTextNode(' › '));
    box.append(el('span', { textContent: 'Report classe' }));
  }
  if (stato.studentiAperti) {
    box.append(document.createTextNode(' › '));
    const ins = stato.insegnamentoCorrente;
    box.append(el('button', { textContent: 'Studenti', onclick: () => mostraStudenti(ins) }));
  }
  if (stato.studenteCorrente) {
    box.append(document.createTextNode(' › '));
    box.append(el('span', { textContent: `${stato.studenteCorrente.cognome} ${stato.studenteCorrente.nome}` }));
  }
}

/** Azzera la posizione nella navigazione sotto il livello "classe". */
function azzeraSottoClasse() {
  stato.attivitaCorrente = null;
  stato.studentiAperti = false;
  stato.studenteCorrente = null;
  stato.reportClasseAperto = false;
}

/**
 * Primo livello di navigazione: le MATERIE del docente, ciascuna una sola volta.
 * I dati sono quelli di /api/insegnamenti (una riga per materia/classe/anno),
 * raggruppati qui per nome della materia (UNIQUE nel database).
 */
async function mostraInsegnamenti() {
  stato.materiaCorrente = null;
  stato.insegnamentoCorrente = null;
  azzeraSottoClasse();
  aggiornaPercorso();
  const contenuto = document.getElementById('contenuto');
  contenuto.textContent = 'Caricamento…';
  try {
    const insegnamenti = await api('/insegnamenti');
    stato.insegnamenti = insegnamenti;
    if (insegnamenti.length === 0) {
      contenuto.textContent = 'Nessun insegnamento trovato per questo docente.';
      return;
    }
    const materie = [...new Set(insegnamenti.map((ins) => ins.materia))]
      .sort((a, b) => a.localeCompare(b, 'it'));
    const lista = el('div', { className: 'elenco' });
    materie.forEach((materia) => {
      const numeroClassi = insegnamenti.filter((ins) => ins.materia === materia).length;
      lista.append(el('button', {
        className: 'scelta',
        onclick: () => mostraClassi(materia),
      }, [
        el('div', { className: 'tit', textContent: materia }),
        el('div', { className: 'sub', textContent: numeroClassi === 1 ? '1 classe' : `${numeroClassi} classi` }),
      ]));
    });
    contenuto.innerHTML = '';
    contenuto.append(lista);
  } catch (errore) {
    contenuto.textContent = 'Errore: ' + errore.message;
  }
}

/**
 * Secondo livello: le CLASSI in cui il docente insegna la materia scelta.
 * Usa gli insegnamenti già caricati da mostraInsegnamenti (nessuna nuova chiamata).
 */
function mostraClassi(materia) {
  stato.materiaCorrente = materia;
  stato.insegnamentoCorrente = null;
  azzeraSottoClasse();
  aggiornaPercorso();
  const contenuto = document.getElementById('contenuto');
  const classi = stato.insegnamenti
    .filter((ins) => ins.materia === materia)
    .sort((a, b) => a.classe.localeCompare(b.classe, 'it', { numeric: true })
      || b.anno_scolastico.localeCompare(a.anno_scolastico));
  const lista = el('div', { className: 'elenco' });
  classi.forEach((ins) => {
    lista.append(el('button', {
      className: 'scelta',
      onclick: () => mostraAttivita(ins),
    }, [
      el('div', { className: 'tit', textContent: ins.classe }),
      el('div', { className: 'sub', textContent: `Anno scolastico ${ins.anno_scolastico}` }),
    ]));
  });
  contenuto.innerHTML = '';
  contenuto.append(el('h2', { textContent: materia }), lista);
}

async function mostraAttivita(insegnamento) {
  stato.materiaCorrente = insegnamento.materia;
  stato.insegnamentoCorrente = insegnamento;
  azzeraSottoClasse();
  aggiornaPercorso();
  const contenuto = document.getElementById('contenuto');
  contenuto.textContent = 'Caricamento…';
  try {
    const [attivita, nuclei] = await Promise.all([
      api(`/insegnamenti/${insegnamento.insegnamento_id}/attivita`),
      api(`/insegnamenti/${insegnamento.insegnamento_id}/nuclei`),
    ]);
    contenuto.innerHTML = '';
    contenuto.append(el('h2', { textContent: `${insegnamento.materia} — ${insegnamento.classe}` }));
    contenuto.append(el('div', { className: 'barra-sezioni' }, [
      el('button', { className: 'azione', textContent: 'Studenti della classe', onclick: () => mostraStudenti(insegnamento) }),
    ]));
    contenuto.append(costruisciFormNuovaAttivita(insegnamento, nuclei));

    if (attivita.length === 0) {
      contenuto.append(el('p', { textContent: 'Nessuna attività per questo insegnamento: creane una qui sopra.' }));
      return;
    }
    const lista = el('div', { className: 'elenco' });
    attivita.forEach((a) => {
      lista.append(el('button', {
        className: 'scelta',
        onclick: () => mostraGriglia(a),
      }, [
        el('div', { className: 'tit', textContent: a.nome }),
        el('div', { className: 'sub', textContent: `${a.nucleo} · ${new Date(a.data_attivita).toLocaleDateString('it-IT')}` }),
      ]));
    });
    contenuto.append(lista);
  } catch (errore) {
    contenuto.textContent = 'Errore: ' + errore.message;
  }
}

/** Numero in formato italiano (es. 1,67), al massimo 2 decimali. */
function numeroIt(valore) {
  return Number(valore).toLocaleString('it-IT', { maximumFractionDigits: 2 });
}

/** Percentuale e giudizio calcolati dal server: "Non valutato" se non c'è alcuna valutazione presente. */
function testoEsito(esito) {
  return esito.percentuale === null ? 'Non valutato' : `${numeroIt(esito.percentuale)}% · ${esito.giudizio}`;
}

/** Risultato corrente di un criterio: media delle ultime osservazioni (ultime N di M). */
function testoRisultatoCorrenteCriterio(r) {
  if (r.percentuale === null) return 'Non valutato';
  let quante;
  if (r.osservazioniConsiderate < r.osservazioniTotali) quante = `ultime ${r.osservazioniConsiderate} di ${r.osservazioniTotali}`;
  else if (r.osservazioniTotali === 1) quante = '1 osservazione';
  else quante = `tutte le ${r.osservazioniTotali} osservazioni`;
  return `media ${numeroIt(r.media)} (${quante}) · ${testoEsito(r)}`;
}

const SPIEGAZIONE_RISULTATO_CORRENTE = 'Risultato corrente = media delle ultime 3 osservazioni di ogni criterio '
  + '(nucleo e materia: media dei criteri valutati, a pesi uguali). '
  + 'Storico = tutte le osservazioni disponibili dall\'inizio dell\'anno.';

/**
 * Studenti della classe (iscrizioni attive della classe/anno dell'insegnamento),
 * ciascuno con il risultato corrente complessivo e per nucleo, calcolato dal
 * server su tutte le attività di questo insegnamento.
 */
async function mostraStudenti(insegnamento) {
  stato.materiaCorrente = insegnamento.materia;
  stato.insegnamentoCorrente = insegnamento;
  azzeraSottoClasse();
  stato.studentiAperti = true;
  aggiornaPercorso();
  const contenuto = document.getElementById('contenuto');
  contenuto.textContent = 'Caricamento…';
  try {
    const dati = await api(`/insegnamenti/${insegnamento.insegnamento_id}/studenti`);
    contenuto.innerHTML = '';
    contenuto.append(el('h2', { textContent: `${insegnamento.materia} — ${insegnamento.classe} · Studenti` }));
    contenuto.append(el('p', { className: 'spiegazione', textContent: SPIEGAZIONE_RISULTATO_CORRENTE }));
    if (dati.studenti.length === 0) {
      contenuto.append(el('p', { textContent: 'Nessuno studente iscritto (attivo) in questa classe per questo anno scolastico.' }));
      return;
    }
    const lista = el('div', { className: 'elenco' });
    dati.studenti.forEach((studente) => {
      const c = studente.complessivo;
      lista.append(el('button', {
        className: 'scelta',
        onclick: () => mostraProgressoStudente(insegnamento, studente),
      }, [
        el('div', { className: 'tit', textContent: `${studente.cognome} ${studente.nome}` }),
        el('div', {

/**
 * Modulo per creare una nuova attività: il nucleo tematico si sceglie SOLO tra
 * quelli già configurati per la materia dell'insegnamento (mai scritti qui nel
 * frontend); i criteri non si specificano mai in questa schermata, derivano
 * automaticamente dal nucleo scelto quando l'attività viene aperta.
 */
function costruisciFormNuovaAttivita(insegnamento, nuclei) {
  const inputNome = el('input', { type: 'text', placeholder: 'Es. Addizioni e sottrazioni', required: true });
  const inputData = el('input', { type: 'date', required: true });
  const selectNucleo = el('select', { required: true }, [
    el('option', { value: '', textContent: nuclei.length ? 'Scegli il nucleo tematico…' : 'Nessun nucleo configurato per questa materia' }),
    ...nuclei.map((n) => el('option', { value: n.nucleo_id, textContent: n.nome })),
  ]);
  const messaggioErrore = el('div', { className: 'errore-form' });
  const bottoneCrea = el('button', { className: 'azione', type: 'submit', textContent: 'Crea attività' });

  const form = el('form', {
    className: 'form-attivita',
    onsubmit: async (evento) => {
      evento.preventDefault();
      messaggioErrore.textContent = '';
      if (!selectNucleo.value) { messaggioErrore.textContent = 'Scegliere un nucleo tematico.'; return; }
      bottoneCrea.disabled = true;
      try {
        await api(`/insegnamenti/${insegnamento.insegnamento_id}/attivita`, {
          method: 'POST',
          body: JSON.stringify({
            nome: inputNome.value,
            dataAttivita: inputData.value,
            nucleoTematicoId: Number(selectNucleo.value),
          }),
        });
        await mostraAttivita(insegnamento); // ricarica l'elenco con la nuova attività
      } catch (errore) {
        messaggioErrore.textContent = 'Impossibile creare l\'attività: ' + errore.message;
        bottoneCrea.disabled = false;
      }
    },
  }, [
    el('h2', { textContent: 'Nuova attività' }),
    el('div', { className: 'campi' }, [
      el('div', {}, [el('label', { textContent: 'Titolo' }), inputNome]),
      el('div', {}, [el('label', { textContent: 'Data' }), inputData]),
      el('div', {}, [el('label', { textContent: 'Nucleo tematico' }), selectNucleo]),
      bottoneCrea,
    ]),
    messaggioErrore,
  ]);
  return form;
}

let menuValutazioneAperto = null;

function chiudiMenuValutazione() {
  if (menuValutazioneAperto) {
    menuValutazioneAperto.remove();
    menuValutazioneAperto = null;
    document.removeEventListener('click', gestisciClicFuoriMenu, true);
    document.removeEventListener('keydown', gestisciEscMenu, true);
  }
}
function gestisciClicFuoriMenu(evento) {
  if (menuValutazioneAperto && !menuValutazioneAperto.contains(evento.target)) chiudiMenuValutazione();
}
function gestisciEscMenu(evento) {
  if (evento.key === 'Escape') chiudiMenuValutazione();
}

/**
 * Al clic su una cella, apre un piccolo menu con le 4 opzioni scritte per
 * esteso (non un ciclo di valori): ogni opzione ha un'etichetta di testo e
 * un colore distinto (grigio/rosso/giallo/verde), coerenti con la cella.
 */
function apriMenuValutazione(attivitaRif, riga, cella, bottone) {
  chiudiMenuValutazione();
  const menu = el('div', { className: 'menu-valutazione', role: 'menu' });
  OPZIONI_VALUTAZIONE.forEach((opzione) => {
    const voce = el('button', {
      type: 'button',
      onclick: () => { chiudiMenuValutazione(); impostaValutazione(attivitaRif, riga, cella, bottone, opzione.punteggio); },
    }, [
      el('span', { className: 'pallino-opzione' }),
      document.createTextNode(opzione.etichetta),
    ]);
    voce.dataset.p = opzione.punteggio === null ? '' : opzione.punteggio;
    if (opzione.punteggio === cella.punteggio) voce.classList.add('selezionata');
    menu.append(voce);
  });

  document.body.append(menu);
  const rettangolo = bottone.getBoundingClientRect();
  const larghezzaMenu = menu.offsetWidth;
  const spazioSotto = window.innerHeight - rettangolo.bottom;
  menu.style.left = Math.min(rettangolo.left, window.innerWidth - larghezzaMenu - 8) + 'px';
  if (spazioSotto < menu.offsetHeight + 8) {
    menu.style.top = (rettangolo.top - menu.offsetHeight - 4) + 'px';
  } else {
    menu.style.top = (rettangolo.bottom + 4) + 'px';
  }
  menuValutazioneAperto = menu;
  // setTimeout: evita che il click che ha aperto il menu lo richiuda subito.
  setTimeout(() => {
    document.addEventListener('click', gestisciClicFuoriMenu, true);
    document.addEventListener('keydown', gestisciEscMenu, true);
  }, 0);
}

async function impostaValutazione(attivitaRif, riga, cella, bottone, nuovo) {
  bottone.disabled = true;
  try {
    await api(`/attivita/${attivitaRif.attivita_id}/iscrizioni/${riga.iscrizioneId}/criteri/${cella.criterioId}`, {
      method: 'PUT',
      body: JSON.stringify({ punteggio: nuovo }),
    });
    // Ricarica la griglia: aggiorna sia la cella sia l'esito della riga.
    await mostraGriglia(attivitaRif);
  } catch (errore) {
    alert('Impossibile salvare: ' + errore.message);
    bottone.disabled = false;
  }
}

async function apriScheda(attivitaRif, riga) {
  const dialogo = document.getElementById('dialogoScheda');

        + `${new Date(scheda.attivita.dataAttivita).toLocaleDateString('it-IT')} · Nucleo: ${scheda.nucleo}`,
    }));

      ]));
    });
    corpo.append(tabella);

    const esito = scheda.esito;
    corpo.append(el('p', {
      textContent: esito.percentuale === null
        ? 'Nessuna valutazione presente in questa attività.'
        : `Esito dell'attività: ${esito.punteggioOttenuto}/${esito.punteggioMassimo} · ${esito.percentuale}% · ${esito.giudizio}`,
    }));

    const nota = el('textarea', { placeholder: 'Nota facoltativa…', value: scheda.nota || '' });
    corpo.append(el('div', {}, [el('div', { textContent: 'Nota', style: 'font-size:.8rem;color:var(--inchiostro-tenue);margin-bottom:.25rem' }), nota]));

    const areaStorico = el('div', { style: 'margin-top:1rem' });
    corpo.append(areaStorico);
    caricaStorico(attivitaRif, riga, scheda, areaStorico);

    const barraAzioni = el('div', { className: 'chiudi' });
    const salva = el('button', { className: 'azione', textContent: 'Salva nota', onclick: async () => {
      try {
        await api(`/attivita/${attivitaRif.attivita_id}/iscrizioni/${riga.iscrizioneId}/nota`, {
          method: 'PUT', body: JSON.stringify({ nota: nota.value || null }),
        });
        salva.textContent = 'Nota salvata ✓';
        setTimeout(() => { salva.textContent = 'Salva nota'; }, 1500);
      } catch (errore) { alert('Impossibile salvare la nota: ' + errore.message); }
    } });
    const chiudi = el('button', { textContent: 'Chiudi', style: 'margin-left:.5rem', onclick: () => dialogo.close() });
    barraAzioni.append(salva, chiudi);
    corpo.append(barraAzioni);
  } catch (errore) {
    corpo.textContent = 'Errore: ' + errore.message;
  }
}

async function caricaStorico(attivitaRif, riga, scheda, contenitore) {
  contenitore.append(el('div', { textContent: 'Risultato corrente dei criteri (media delle ultime 3 osservazioni, su tutte le attività di questo nucleo)', style: 'font-size:.85rem;font-weight:600;margin-bottom:.4rem' }));
  const righeBarra = new Map();
  scheda.criteri.forEach((c) => {
    const barra = el('i', { style: 'width:0%' });
    const valore = el('span', { className: 'val', textContent: '…' });
    contenitore.append(el('div', { className: 'storico-riga' }, [
      el('span', { className: 'nome', textContent: c.nome }),
      el('div', { className: 'barra' }, [barra]),
      valore,
    ]));
    righeBarra.set(c.criterioId, { barra, valore });
  });

  await Promise.all(scheda.criteri.map(async (c) => {
    try {
      const esito = await api(
        `/alunni/${scheda.personaId}/anni/${scheda.annoScolasticoId}/nuclei/${scheda.nucleoTematicoId}/criteri/${c.criterioId}/storico`
      );
      const { barra, valore } = righeBarra.get(c.criterioId);
      if (esito.percentuale === null) {
        valore.textContent = '—';
      } else {
        barra.style.width = esito.percentuale + '%';
        valore.textContent = esito.percentuale + '%';
      }
    } catch (errore) {
      righeBarra.get(c.criterioId).valore.textContent = 'errore';
    }
  }));

  // Riepilogo dell'intero nucleo (cumulativo su tutte le attività, non solo quella corrente).
  contenitore.append(el('div', { textContent: 'Risultato corrente del nucleo (media dei criteri valutati)', style: 'font-size:.85rem;font-weight:600;margin:.9rem 0 .4rem' }));
  const barraNucleo = el('i', { style: 'width:0%' });
  const valoreNucleo = el('span', { className: 'val', textContent: '…' });
  contenitore.append(el('div', { className: 'storico-riga' }, [
    el('span', { className: 'nome', textContent: scheda.nucleo }),
    el('div', { className: 'barra' }, [barraNucleo]),
    valoreNucleo,
  ]));
  try {
    const riepilogo = await api(`/alunni/${scheda.personaId}/anni/${scheda.annoScolasticoId}/nuclei/${scheda.nucleoTematicoId}/riepilogo`);
    if (riepilogo.percentuale === null) {
      valoreNucleo.textContent = '—';
    } else {
      barraNucleo.style.width = riepilogo.percentuale + '%';
      valoreNucleo.textContent = `${riepilogo.percentuale}% · ${riepilogo.giudizio}`;
    }
  } catch (errore) {
    valoreNucleo.textContent = 'errore';
  }
}

document.getElementById('docenteId').addEventListener('change', mostraInsegnamenti);
document.getElementById('dialogoScheda').addEventListener('click', (evento) => {
  if (evento.target === evento.currentTarget) evento.currentTarget.close();
});
mostraInsegnamenti();
</script>
