<!doctype html>
<!-- lang, dir e title sono impostati dal client con il catalogo risolto dal server (C2/P3): questa pagina non contiene testi. -->
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title></title>
<link rel="stylesheet" href="/css/app.css" />
</head>
<body>
<header class="app" id="intestazione" hidden>
  <button type="button" class="titolo-app" id="titolo-app"></button>
  <span class="utente" id="utente"></span>
  <span class="controllo">
    <label for="tenant" id="etichetta-tenant"></label>
    <select id="tenant"></select>
  </span>
  <span class="controllo" id="blocco-lingua" hidden>
    <label for="lingua" id="etichetta-lingua"></label>
    <select id="lingua"></select>
  </span>
  <button type="button" class="collegamento-chiaro" id="come-leggere-apri" aria-controls="come-leggere" aria-expanded="false"></button>
  <button type="button" class="collegamento-chiaro" id="amministrazione" hidden></button>
  <button type="button" class="collegamento-chiaro" id="esci"></button>
</header>
<aside class="come-leggere" id="come-leggere" hidden></aside>
<main>
  <nav class="percorso" id="percorso"></nav>
  <div id="errore" aria-live="assertive"></div>
  <div id="contenuto"></div>
</main>
<script src="/js/i18n.js"></script>
<script src="/js/grammatica.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
